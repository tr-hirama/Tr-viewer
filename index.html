<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DXF / TRC ビューワー</title>
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; font-family: "Segoe UI", "Meiryo", sans-serif; }
  body { display: flex; flex-direction: column; background: #1e1e1e; color: #ddd; }

  header {
    flex: 0 0 auto;
    display: flex;
    align-items: center;
    gap: 16px;
    padding: 8px 16px;
    background: #2d2d30;
    border-bottom: 1px solid #3f3f46;
  }
  header h1 { font-size: 15px; margin: 0; font-weight: 600; white-space: nowrap; line-height: 1.1; }
  #titleBox { display: flex; flex-direction: column; }
  #version { font-size: 10px; color: #7a7a7a; }
  #controls { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
  #controls.hidden { display: none; }
  #controls label { font-size: 12px; color: #cfcfcf; display: flex; align-items: center; gap: 4px; cursor: pointer; }
  #info { font-size: 12px; color: #9a9a9a; margin-left: auto; white-space: nowrap; }
  #fileLabel {
    font-size: 12px;
    background: #0e639c;
    color: #fff;
    padding: 4px 12px;
    border-radius: 4px;
    cursor: pointer;
    white-space: nowrap;
  }
  #fileLabel:hover { background: #1177bb; }
  #saveBtn {
    font-size: 12px;
    background: #3a7d44;
    color: #fff;
    border: none;
    padding: 5px 12px;
    border-radius: 4px;
    cursor: pointer;
    white-space: nowrap;
    font-family: inherit;
  }
  #saveBtn:hover { background: #469152; }
  #saveBtn.hidden { display: none; }

  #levelXlsxBtn {
    font-size: 12px;
    background: #1f7a6e;
    color: #fff;
    border: none;
    padding: 5px 12px;
    border-radius: 4px;
    cursor: pointer;
    white-space: nowrap;
    font-family: inherit;
  }
  #levelXlsxBtn:hover { background: #259384; }
  #levelXlsxBtn.hidden { display: none; }

  #bothBtn {
    font-size: 12px;
    background: #7a4fa0;
    color: #fff;
    border: none;
    padding: 5px 12px;
    border-radius: 4px;
    cursor: pointer;
    white-space: nowrap;
    font-family: inherit;
  }
  #bothBtn:hover { background: #925fbf; }
  #bothBtn.hidden { display: none; }

  #main { display: flex; flex: 1 1 auto; min-height: 0; }
  #stage { position: relative; flex: 2 1 0; min-width: 0; overflow: hidden; }
  #splitter { flex: 0 0 6px; background: #3f3f46; cursor: col-resize; }
  #splitter:hover { background: #5a5a64; }
  canvas { display: block; width: 100%; height: 100%; background: #ffffff; }

  #drop {
    position: absolute; inset: 0;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    gap: 12px;
    pointer-events: none;
    color: #888;
    transition: background 0.15s, color 0.15s;
  }
  #drop.empty { pointer-events: auto; }
  #drop.over {
    background: rgba(14, 99, 156, 0.25);
    color: #cfe8ff;
    border: 2px dashed #1177bb;
  }
  #drop .big { font-size: 22px; }
  #drop .small { font-size: 13px; }
  #drop.hidden { display: none; }

  #hud {
    position: absolute; left: 12px; bottom: 10px;
    font-size: 11px; color: #e6e6e6;
    background: rgba(0,0,0,0.72);
    padding: 4px 8px; border-radius: 4px;
    pointer-events: none;
  }
  #coord {
    position: absolute; right: 12px; bottom: 10px;
    font-size: 11px; color: #bfe0ff; font-variant-numeric: tabular-nums;
    background: rgba(0,0,0,0.72);
    padding: 4px 8px; border-radius: 4px;
    pointer-events: none;
  }

  #panel {
    flex: 1 1 0; min-width: 0;
    background: #252526;
    overflow: auto; padding: 10px 12px;
    font-size: 12px;
  }
  #panel.hidden { display: none; }
  #panel h2 {
    font-size: 12px; margin: 14px 0 6px; color: #9cdcfe;
    border-bottom: 1px solid #3f3f46; padding-bottom: 3px;
  }
  #panel h2:first-child { margin-top: 0; }
  #panel .tabs {
    display: flex; gap: 4px; margin-bottom: 12px;
    border-bottom: 1px solid #3f3f46; padding-bottom: 8px;
  }
  #panel .tab {
    font-family: inherit; font-size: 12px; color: #cfcfcf;
    background: #333337; border: 1px solid #3f3f46;
    padding: 6px 12px; border-radius: 4px; cursor: pointer; white-space: nowrap;
  }
  #panel .tab:hover { background: #3f3f46; color: #fff; }
  #panel .tab.active { background: #0e639c; border-color: #0e639c; color: #fff; }

  /* モバイル: 図面/データ 切替ボタン (スマホのみ表示) */
  #viewToggle {
    display: none;
    font-size: 12px; font-family: inherit;
    background: #5a3d8c; color: #fff; border: none;
    padding: 5px 12px; border-radius: 4px; cursor: pointer; white-space: nowrap;
  }
  #viewToggle:hover { background: #6c4ba6; }
  #viewToggle.hidden { display: none; }

  /* スマホ幅: 画面分割せず、図面/データをボタンで全面切替 */
  @media (max-width: 768px) {
    #splitter { display: none; }
    #stage, #panel { flex: 1 1 100% !important; width: 100%; min-width: 0; }
    #panel { display: none; }
    #main.view-panel #stage { display: none; }
    #main.view-panel #panel { display: block; }
    #viewToggle { display: inline-block; }
    #viewToggle.hidden { display: none; }
    header { gap: 8px; }
  }
  #panel table { border-collapse: collapse; width: 100%; }
  #panel th, #panel td {
    border: 1px solid #3a3a3a; padding: 2px 5px;
    text-align: right; white-space: nowrap; font-variant-numeric: tabular-nums;
  }
  #panel th { background: #333337; color: #ccc; text-align: center; }
  #panel td.l { text-align: left; }
  #panel td.plus { color: #7fd17f; }
  #panel td.minus { color: #f08a8a; }
  #panel td.err { background: #5a1f1f; color: #ffb3b3; font-weight: bold; }
  #panel td.mk-ok   { background: #16384a; color: #9fd6ff; }
  #panel td.mk-warn { background: #4a3c10; color: #ffd866; }
  #panel td.mk-ng   { background: #5a1f1f; color: #ffb3b3; font-weight: bold; }
  #panel .note .mk-ok   { color: #9fd6ff; }
  #panel .note .mk-warn { color: #ffd866; }
  #panel .note .mk-ng   { color: #ffb3b3; }
  #panel .empty { color: #777; }
  #panel .note { color: #888; margin: 4px 0 0; font-size: 11px; }
  #panel pre.raw {
    margin: 0; padding: 8px; background: #1a1a1d; border: 1px solid #333337;
    border-radius: 4px; color: #d4d4d4; font-size: 11px; line-height: 1.45;
    white-space: pre; overflow: auto; max-height: calc(100vh - 160px);
    font-family: "Consolas", "Courier New", monospace;
  }
</style>
</head>
<body>
  <header>
    <div id="titleBox">
      <h1>DXF / TRC ビューワー</h1>
      <span id="version">v0.9.0</span>
    </div>
    <button id="bothBtn" class="hidden" title="DXF とレベル Excel をまとめて出力">DXF+レベル</button>
    <label id="fileLabel">ファイルを開く
      <input id="fileInput" type="file" accept=".dxf,.trc" hidden>
    </label>
    <button id="saveBtn" class="hidden" title="表示中の図面を DXF で保存">DXF保存</button>
    <button id="levelXlsxBtn" class="hidden" title="レベル（水準）データを雛形 Excel (.xlsm) に差し込んで出力">レベルExcel</button>
    <button id="viewToggle" class="hidden" title="図面とデータを切り替え">📋 データ</button>
    <div id="controls" class="hidden">
      <label><input type="checkbox" id="chkLine" checked> 線</label>
      <label><input type="checkbox" id="chkLabel" checked> 点名</label>
      <label><input type="checkbox" id="chkMoji" checked> 文字</label>
      <label><input type="checkbox" id="chkFrame" checked> 図枠</label>
    </div>
    <span id="info"></span>
  </header>

  <div id="main">
    <div id="stage">
      <canvas id="canvas"></canvas>
      <div id="drop" class="empty">
        <div class="big">📐 DXF / TRC ファイルをここにドロップ</div>
        <div class="small">またはヘッダーの「ファイルを開く」から選択（.dxf / .trc）</div>
      </div>
      <div id="hud">ホイール: 拡大縮小 / ドラッグ: 移動 / ダブルクリック: 全体表示</div>
      <div id="coord"></div>
    </div>
    <div id="splitter"></div>
    <div id="panel"></div>
  </div>

<script>
"use strict";

// ===========================================================================
// DXF パーサ (ASCII DXF の group-code / value ペアを読み、基本エンティティを抽出)
// ===========================================================================
function parseDxf(text) {
  const lines = text.split(/\r\n|\r|\n/);
  const pairs = [];
  for (let i = 0; i + 1 < lines.length; i += 2) {
    const code = parseInt(lines[i].trim(), 10);
    if (Number.isNaN(code)) continue;
    pairs.push([code, lines[i + 1]]);
  }

  const entities = [];
  let i = 0;
  const n = pairs.length;

  while (i < n) {
    const [code, val] = pairs[i];
    if (code === 0 && val.trim() === "SECTION") {
      if (i + 1 < n && pairs[i + 1][0] === 2 && pairs[i + 1][1].trim() === "ENTITIES") {
        i += 2;
        break;
      }
    }
    i++;
  }

  function readEntity(startType) {
    const e = { type: startType, props: {}, vertices: [] };
    let pendingX = null;
    while (i < n) {
      const [code, raw] = pairs[i];
      if (code === 0) break;
      const val = raw.trim();
      if (code === 10) {
        pendingX = parseFloat(val);
        e.props.x = parseFloat(val);
      } else if (code === 20) {
        e.props.y = parseFloat(val);
        if (pendingX !== null && startType === "LWPOLYLINE") {
          e.vertices.push({ x: pendingX, y: parseFloat(val) });
          pendingX = null;
        }
      } else if (code === 11) { e.props.x2 = parseFloat(val); }
      else if (code === 21) { e.props.y2 = parseFloat(val); }
      else if (code === 40) { e.props.r = parseFloat(val); e.props.height = parseFloat(val); }
      else if (code === 50) { e.props.startAngle = parseFloat(val); }
      else if (code === 51) { e.props.endAngle = parseFloat(val); }
      else if (code === 70) { e.props.flags = parseInt(val, 10); }
      else if (code === 1)  { e.props.text = raw; }
      else if (code === 8)  { e.props.layer = val; }
      i++;
    }
    return e;
  }

  function readPolyline() {
    const e = { type: "POLYLINE", props: {}, vertices: [] };
    while (i < n && pairs[i][0] !== 0) {
      const [code, raw] = pairs[i];
      if (code === 70) e.props.flags = parseInt(raw.trim(), 10);
      if (code === 8) e.props.layer = raw.trim();
      i++;
    }
    while (i < n) {
      const [code, val] = pairs[i];
      if (code === 0) {
        const t = val.trim();
        if (t === "VERTEX") {
          i++;
          let vx = 0, vy = 0;
          while (i < n && pairs[i][0] !== 0) {
            const [c, r] = pairs[i];
            if (c === 10) vx = parseFloat(r.trim());
            else if (c === 20) vy = parseFloat(r.trim());
            i++;
          }
          e.vertices.push({ x: vx, y: vy });
        } else if (t === "SEQEND") {
          i++;
          while (i < n && pairs[i][0] !== 0) i++;
          break;
        } else {
          break;
        }
      } else {
        i++;
      }
    }
    return e;
  }

  while (i < n) {
    const [code, raw] = pairs[i];
    const val = raw.trim();
    if (code === 0) {
      if (val === "ENDSEC") break;
      const type = val;
      i++;
      if (type === "POLYLINE") {
        entities.push(readPolyline());
      } else if (["LINE", "LWPOLYLINE", "CIRCLE", "ARC", "POINT", "TEXT", "MTEXT"].includes(type)) {
        entities.push(readEntity(type));
      } else {
        while (i < n && pairs[i][0] !== 0) i++;
      }
    } else {
      i++;
    }
  }

  return entities;
}

// ===========================================================================
// TRC パーサ (Tr-CAD / vbSurvey 形式)
//   実体は ZIP (先頭 "PK\x03\x04") で、内部に Shift-JIS の TrDATA.trc を持つ。
//   平文テキストの場合もあるため両対応。
//   TrDATA.trc は *XXX-Section* ... *Section-End* のセクション構造。
// ===========================================================================

// raw deflate を展開 (ブラウザ標準 DecompressionStream を使用、外部ライブラリ不要)
async function inflateRaw(u8) {
  const ds = new DecompressionStream("deflate-raw");
  const stream = new Response(u8).body.pipeThrough(ds);
  const ab = await new Response(stream).arrayBuffer();
  return new Uint8Array(ab);
}

// ZIP セントラルディレクトリから指定エントリを取り出す
function extractZipEntry(buf, wantName) {
  const dv = new DataView(buf);
  const u8 = new Uint8Array(buf);
  let eocd = -1;
  for (let i = buf.byteLength - 22; i >= 0; i--) {
    if (dv.getUint32(i, true) === 0x06054b50) { eocd = i; break; }
  }
  if (eocd < 0) throw new Error("ZIP の終端レコードが見つかりません");
  const cdCount = dv.getUint16(eocd + 10, true);
  let p = dv.getUint32(eocd + 16, true);
  const asc = new TextDecoder("ascii");
  for (let k = 0; k < cdCount; k++) {
    if (dv.getUint32(p, true) !== 0x02014b50) break;
    const method   = dv.getUint16(p + 10, true);
    const compSize = dv.getUint32(p + 20, true);
    const nameLen  = dv.getUint16(p + 28, true);
    const extraLen = dv.getUint16(p + 30, true);
    const cmtLen   = dv.getUint16(p + 32, true);
    const lhOff    = dv.getUint32(p + 42, true);
    const name = asc.decode(u8.subarray(p + 46, p + 46 + nameLen));
    if (name === wantName || name.endsWith("/" + wantName)) {
      const lNameLen  = dv.getUint16(lhOff + 26, true);
      const lExtraLen = dv.getUint16(lhOff + 28, true);
      const start = lhOff + 30 + lNameLen + lExtraLen;
      return { method, data: u8.subarray(start, start + compSize) };
    }
    p += 46 + nameLen + extraLen + cmtLen;
  }
  throw new Error(wantName + " が ZIP 内に見つかりません");
}

function decodeSjis(u8) {
  // UTF-8 BOM があれば UTF-8 確定
  if (u8.length >= 3 && u8[0] === 0xEF && u8[1] === 0xBB && u8[2] === 0xBF) {
    return new TextDecoder("utf-8", { fatal: false }).decode(u8);
  }
  // 厳密 UTF-8 として解釈できれば UTF-8、不正バイト列なら Shift_JIS とみなす。
  // (ASCII のみのファイルは両者同一なので影響なし)
  try {
    return new TextDecoder("utf-8", { fatal: true }).decode(u8);
  } catch (e) {
    return new TextDecoder("shift_jis", { fatal: false }).decode(u8);
  }
}

// ArrayBuffer -> TrDATA テキスト (ZIP / 平文の両対応)
async function readTrcText(buf) {
  const u8 = new Uint8Array(buf);
  if (u8.length >= 4 && u8[0] === 0x50 && u8[1] === 0x4B && u8[2] === 0x03 && u8[3] === 0x04) {
    const { method, data } = extractZipEntry(buf, "TrDATA.trc");
    let bytes;
    if (method === 0) bytes = data;
    else if (method === 8) bytes = await inflateRaw(data);
    else throw new Error("未対応の ZIP 圧縮方式: " + method);
    return decodeSjis(bytes);
  }
  return decodeSjis(u8);
}

// 1 行を CSV 分解 (ダブルクォート対応・各フィールド trim)
function splitCsv(line) {
  const out = [];
  let cur = "", inQ = false;
  for (let i = 0; i < line.length; i++) {
    const c = line[i];
    if (inQ) {
      if (c === '"') {
        if (line[i + 1] === '"') { cur += '"'; i++; }
        else inQ = false;
      } else cur += c;
    } else {
      if (c === '"') inQ = true;
      else if (c === ",") { out.push(cur.trim()); cur = ""; }
      else cur += c;
    }
  }
  out.push(cur.trim());
  return out;
}

const num = (v) => { const f = parseFloat(v); return isFinite(f) ? f : 0; };

function parseTrc(text) {
  const trc = {
    points: [], lines: [], circles: [], mojis: [],
    hedges: [], plines: [], blocks: new Map(), inserts: [],
    levels: [], surveyData: [], surveyRaw: [],
    mawariken: [], keisantenFlg: false, comments: [], overview: {}
  };
  let section = null;
  let inBlockPts = false, inPlinePts = false;
  let curBlock = null, curPline = null;
  let inDataSec = false;  // *SurveyData-Section* 内の *DATA -SECTION* 内か

  for (const raw of text.split(/\r\n|\r|\n/)) {
    const line = raw.trim();
    if (line === "") continue;

    // セクション制御 (-Section* / -End* で終わる行)
    if (line[0] === "*" && (line.endsWith("-Section*") || line.endsWith("-End*"))) {
      if (line === "*BlockPoint-Section*") inBlockPts = true;
      else if (line === "*BlockPoint-End*") inBlockPts = false;
      else if (line === "*PlinePoint-Section*") inPlinePts = true;
      else if (line === "*PlinePoint-End*") inPlinePts = false;
      else if (line === "*Section-End*") { section = null; curBlock = null; curPline = null; inDataSec = false; }
      else section = line;
      continue;
    }

    // *SurveyData-Section* 内は野帳形式 (*BASE -SECTION / *DATA -SECTION ... *END-SECTION)
    if (section === "*SurveyData-Section*") {
      if (line === "*DATA -SECTION") { inDataSec = true; continue; }
      if (line === "*END-SECTION") { inDataSec = false; continue; }
      if (line[0] === "*" || line[0] === "#") continue; // *BASE -SECTION や *** コメント
      // 野帳が O1K/O2K 形式 (行頭 A/B/C/D/E/F/Z…) の場合に備え生行を保持
      trc.surveyRaw.push(line);
      if (!inDataSec) continue;
      const f = splitCsv(line);
      if (f.length < 8) continue;
      // 器械点(0),X(1),Y(2),後視点(3),方向角(4),測点(5),水平角"度/分/秒"(6),距離(7),傾斜角(8)
      const ip = f[0] === "-1" ? "" : f[0];
      const houi = (f[4] || "").trim();
      const bs = houi === "0/ 0/ 0" ? "N" : (f[3] === "-1" ? "" : f[3]);
      const ang = (f[6] || "").split("/").map(s => s.trim());
      const dist = (f[7] === "-1.000" || f[7] === "-1") ? "" : f[7];
      trc.surveyData.push({ ip, bs, sokuten: f[5] || "",
                            sui: ang[0] || "", hei: ang[1] || "", kaku: ang[2] || "",
                            dist, err: "" });
      continue;
    }

    const f = splitCsv(line);
    switch (section) {
      case "*Point-Section*":
        // Name(0),X(1),Y(2),NotDispFLG(3),SketchFLG(4),delFLG(5),YotenFLG(6)
        trc.points.push({ name: f[0], x: num(f[1]), y: num(f[2]),
                          notDisp: parseInt(f[3], 10) || 0,
                          sketch: parseInt(f[4], 10) || 0,
                          del: parseInt(f[5], 10) || 0,
                          yoten: parseInt(f[6], 10) || 0 });
        break;
      case "*Line-Section*":
        // Name(0),Layer(1),pnA(2),pnB(3),delFLG(4),SketchFLG(5),Style(6)
        trc.lines.push({ name: f[0], layer: f[1], pnA: f[2], pnB: f[3],
                         del: parseInt(f[4], 10) || 0,
                         sketch: parseInt(f[5], 10) || 0,
                         style: parseInt(f[6], 10) || 1 });
        break;
      case "*Circle-Section*":
        // Name(0),Layer(1),X(2),Y(3),Radius(4),FillFLG(5),delFLG(6),SketchFLG(7),PointName(8),PhotoFLG(9)
        trc.circles.push({ name: f[0], layer: f[1], x: num(f[2]), y: num(f[3]), r: num(f[4]),
                           fill: parseInt(f[5], 10) || 0,
                           del: parseInt(f[6], 10) || 0,
                           sketch: parseInt(f[7], 10) || 0,
                           pointName: (f[8] || "").trim(),
                           photo: parseInt(f[9], 10) || 0 });
        break;
      case "*Moji-Section*":
        // Name(0),Layer(1),Moji(2),X(3),Y(4),Height(5),delFLG(6),SketchFLG(7),Angle(8)
        trc.mojis.push({ name: f[0], layer: f[1], text: f[2], x: num(f[3]), y: num(f[4]),
                         height: num(f[5]),
                         del: parseInt(f[6], 10) || 0,
                         sketch: parseInt(f[7], 10) || 0,
                         angle: num(f[8]) });
        break;
      case "*Hedge-Section*":
        // Name(0),X1(1),Y1(2),X2(3),Y2(4),delFLG(5)
        trc.hedges.push({ name: f[0], x1: num(f[1]), y1: num(f[2]), x2: num(f[3]), y2: num(f[4]),
                          del: parseInt(f[5], 10) || 0 });
        break;
      case "*Insert-Section*":
        // Name(0),Layer(1),BlockName(2),X(3),Y(4),Angle(5),delFLG(6)
        trc.inserts.push({ name: f[0], layer: f[1], block: f[2], x: num(f[3]), y: num(f[4]),
                           angle: num(f[5]), del: parseInt(f[6], 10) || 0 });
        break;
      case "*Level-Section*":
        // 保存形式: 測点名, BS(後視), FS(前視), 備考, [TP(中間)]
        trc.levels.push({ name: f[0], bs: f[1], fs: f[2], remarks: f[3] || "", tp: f.length > 4 ? f[4] : "" });
        break;
      case "*Pline-Section*":
        // header: Name(0),delFLG(1),SketchFLG(2) / PlinePoint: X(0),Y(1)
        if (inPlinePts) { if (curPline) curPline.pts.push({ x: num(f[0]), y: num(f[1]) }); }
        else {
          curPline = { name: f[0], del: parseInt(f[1], 10) || 0,
                       sketch: parseInt(f[2], 10) || 0, pts: [] };
          trc.plines.push(curPline);
        }
        break;
      case "*Block-Section*":
        if (inBlockPts) { if (curBlock) curBlock.pts.push({ x: num(f[0]), y: num(f[1]) }); }
        else { curBlock = { name: f[0], pts: [] }; trc.blocks.set(f[0], curBlock); }
        break;
      case "*Mawariken-Section*":
        // KeisantenFlg,フラグ / または 境界(0),まわりけん入力(1),計算値(2),測定不能(3)
        if (f[0] === "KeisantenFlg") { trc.keisantenFlg = (f[1] || "").trim() === "1"; }
        else if (f.length >= 2) {
          const input = (f[1] || "").trim();
          const unable = f.length >= 4 ? /true/i.test(f[3] || "") : (input === "");
          trc.mawariken.push({ kyokai: (f[0] || "").trim(), input, unable });
        }
        break;
      case "*Comment-Section*":
        // SortNum(0),Check(1),全文(2),改行入りテキスト(3, |区切り),順序(4)
        if (f.length >= 4) {
          trc.comments.push({ sort: parseInt(f[0], 10) || 0, check: /true/i.test(f[1] || ""),
                              text: (f[3] || f[2] || "") });
        }
        break;
      case "*Overview-Section*": {
        // 1行目: 案件番号(0),担当ｱｶｳﾝﾄ(1),担当氏名(2),Ver(3),日付(4),営業所(5),邸名(6),住所(7),緯度(8),経度(9)
        // 2行目: ,PC名(1),保存日時(2)
        const o = trc.overview;
        const v = (s) => (s == null ? "" : String(s)).trim();
        if (f.length >= 8) {
          o.caseNo = v(f[0]); o.account = v(f[1]); o.name = v(f[2]); o.version = v(f[3]);
          o.date = v(f[4]); o.office = v(f[5]); o.teiName = v(f[6]); o.address = v(f[7]);
          o.lat = v(f[8]); o.lng = v(f[9]);
        } else if (v(f[0]) === "" && f.length >= 3) {
          o.pc = v(f[1]); o.savedAt = v(f[2]);
        }
        break;
      }
    }
  }

  // *DATA -SECTION 形式で測角データが取れなかった場合、O1K/O2K 野帳形式を解釈する
  if (trc.surveyData.length === 0 && trc.surveyRaw.length) {
    trc.surveyData = parseSurveyO1kO2k(trc.surveyRaw);
  }

  trc.pointMap = new Map(trc.points.map(p => [p.name, p]));
  return trc;
}

// O1K / O2K 野帳形式 (MAGNET Field 等) の測角データを解釈する。
// cad-trcad frmTrCAD.AddDataTable_O1kO2k を移植。
//   D,<器械点>,...            器械点設定
//   F,<点名>,, ,<符号>,<水平角DDD.MMSS>,<鉛直角>,<斜距離>,…,<水平距離(13)>,<水平距離(14)>,…
//   各器械点で最初の F は後視点、以降の F が観測 (測点) 行。
//   O1K は距離が item[13]、O2K は item[14]。
function parseSurveyO1kO2k(lines) {
  const rows = [];
  const dec = (s) => {                       // VB CDec(...).ToString 相当 (数値なら桁揃え無しの数値文字列)
    s = (s == null ? "" : String(s)).trim();
    return (s !== "" && !isNaN(Number(s))) ? String(Number(s)) : s;
  };
  let ipTen = "", bsTen = "";
  let flgRead = false, flgReadO1k1st = false;

  for (const txt of lines) {
    const lst = txt.split(",");
    const code = (lst[0] || "").trim();
    if (code === "Z") {
      flgRead = false; flgReadO1k1st = false;
    } else if (code === "D") {
      flgRead = false;
      ipTen = (lst[1] || "").trim();
    } else if (code === "F") {
      if (!flgRead) bsTen = (lst[1] || "").trim();

      // O1K: item[13] に距離があり、まだ初回観測を読んでいない場合
      if ((lst[13] || "") !== "" && !flgReadO1k1st) {
        flgRead = true;
        bsTen = "N";
      }

      if (!flgRead) {
        flgRead = true;            // この F は後視点 → 行を作らずスキップ
      } else {
        if ((lst[13] || "") !== "") flgReadO1k1st = true;

        const sokuTen = (lst[1] || "").trim();

        // 水平角 DDD.MMSS
        const ang = lst[5] || "";
        const doo  = dec(ang.substr(0, 3));
        const fun  = dec(ang.substr(4, 2));
        const byou = dec(ang.substr(6, 2));

        // 水平距離 (O1K=13 / O2K=14)
        let dist = (lst[13] || "");
        if (dist === "") dist = (lst[14] || "");
        if (dist.trim() !== "" && !isNaN(Number(dist))) dist = Number(dist).toFixed(3);

        rows.push({ ip: ipTen, bs: bsTen, sokuten: sokuTen,
                    sui: doo, hei: fun, kaku: byou, dist, err: "" });

        ipTen = ""; bsTen = "";
      }
    }
  }
  return rows;
}

// ===========================================================================
// レベル（水準）計算 — cad-trcad frmReCalc.LevelReCalc を移植 (整数mm相対値)
//   後視(BS)数値 → 基準 (LevelBS, LevelGH) 更新 / 前視(FS) → GH = LevelBS - FS + LevelGH
//   中間(TP)数値 → GH = LevelBS - TP + LevelGH / 先頭の後視 → 基準点 GH=0
//   与点チェック: 確定済み同名点との GH 差。|差| >= 20mm で不一致(赤)。
// ===========================================================================
const LEVEL_YOTEN_LIMIT = 20; // frmTrCAD._LevelYotenLimit = 20 (mm)

function computeLevels(levels) {
  const isNum = (s) => { s = (s == null ? "" : String(s)).trim(); return s !== "" && !isNaN(Number(s)); };
  const toInt = (s) => Math.round(Number(String(s).trim())); // VB CInt 相当
  const fixed = [];
  let levelBS = 0, levelGH = 0;

  return levels.map((l, idx) => {
    const NM = (l.name || "").trim();
    const BS = (l.bs || "").trim();
    const FS = (l.fs || "").trim();
    const TP = (l.tp || "").trim();
    let gh = null;
    let yotenCheck = false;

    if (NM === "") {
      // 点名が空 → スキップ
    } else if ("[" + NM + "]" === BS) {
      levelGH = 0; gh = 0; // 自己参照 (基準点)
    } else if (isNum(BS)) {
      if (idx === 0) { levelBS = toInt(BS); levelGH = 0; gh = 0; }
      else { const ref = fixed.find(r => r.name === NM); if (ref) { levelBS = toInt(BS); levelGH = ref.gh; gh = levelGH; } }
    } else if (BS.startsWith("[") && (isNum(FS) || isNum(TP))) {
      const referNM = BS.substring(1).replace("]", "");
      const ref = fixed.find(r => r.name === referNM);
      if (ref) { gh = ref.gh + (isNum(FS) ? toInt(FS) : toInt(TP)); yotenCheck = true; }
    } else if (isNum(FS)) {
      gh = levelBS - toInt(FS) + levelGH; yotenCheck = true;
    } else if (isNum(TP)) {
      gh = levelBS - toInt(TP) + levelGH; yotenCheck = true;
    }

    let ck = null, ckError = false;
    if (yotenCheck && gh != null) {
      const prior = fixed.find(r => r.name === NM);
      if (prior) { ck = prior.gh - gh; ckError = Math.abs(ck) >= LEVEL_YOTEN_LIMIT; }
    }

    if (NM !== "" && gh != null) fixed.push({ name: NM, gh });
    // 器械高(IH) = 基準高 + 後視 (mm)。trcad レベルExcel の D 列に相当。
    return { name: l.name, bs: l.bs, fs: l.fs, tp: l.tp, remarks: l.remarks, gh, ck, ckError, ih: levelGH + levelBS };
  });
}

// ===========================================================================
// 状態
// ===========================================================================
const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d");
const info = document.getElementById("info");
const dropEl = document.getElementById("drop");
const controls = document.getElementById("controls");
const coordEl = document.getElementById("coord");
const panel = document.getElementById("panel");
const chkLine = document.getElementById("chkLine");
const chkLabel = document.getElementById("chkLabel");
const chkMoji = document.getElementById("chkMoji");
const chkFrame = document.getElementById("chkFrame");
const saveBtn = document.getElementById("saveBtn");
const levelXlsxBtn = document.getElementById("levelXlsxBtn");
const bothBtn = document.getElementById("bothBtn");
const viewToggle = document.getElementById("viewToggle");

let mode = null;          // "dxf" | "trc"
let currentName = "";     // 読み込み中ファイル名
let entities = [];        // DXF
let trc = null;           // TRC
let trcRawText = "";      // TRC 生テキスト
let view = { scale: 1, ox: 0, oy: 0 };
let hasData = false;

// ===========================================================================
// 表示領域計算
// ===========================================================================
function resizeCanvas() {
  const dpr = window.devicePixelRatio || 1;
  const rect = canvas.getBoundingClientRect();
  canvas.width = Math.round(rect.width * dpr);
  canvas.height = Math.round(rect.height * dpr);
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
}

function computeBounds() {
  let minX = Infinity, minY = Infinity, maxX = -Infinity, maxY = -Infinity;
  const ext = (x, y) => {
    if (!isFinite(x) || !isFinite(y)) return;
    if (x < minX) minX = x; if (y < minY) minY = y;
    if (x > maxX) maxX = x; if (y > maxY) maxY = y;
  };
  if (mode === "trc") {
    for (const p of trc.points) ext(p.x, p.y);
    for (const c of trc.circles) { ext(c.x - c.r, c.y - c.r); ext(c.x + c.r, c.y + c.r); }
    for (const m of trc.mojis) ext(m.x, m.y);
    for (const h of trc.hedges) { ext(h.x1, h.y1); ext(h.x2, h.y2); }
    for (const pl of trc.plines) for (const v of pl.pts) ext(v.x, v.y);
    for (const ins of trc.inserts) {
      const blk = trc.blocks.get(ins.block);
      if (blk) for (const v of blk.pts) ext(v.x + ins.x, v.y + ins.y);
    }
  } else if (mode === "dxf") {
    for (const e of entities) {
      switch (e.type) {
        case "LINE":
          ext(e.props.x, e.props.y); ext(e.props.x2, e.props.y2); break;
        case "CIRCLE":
        case "ARC":
          ext(e.props.x - e.props.r, e.props.y - e.props.r);
          ext(e.props.x + e.props.r, e.props.y + e.props.r); break;
        case "POINT":
        case "TEXT":
        case "MTEXT":
          ext(e.props.x, e.props.y); break;
        case "LWPOLYLINE":
        case "POLYLINE":
          for (const v of e.vertices) ext(v.x, v.y); break;
      }
    }
  }
  if (!isFinite(minX)) return null;
  return { minX, minY, maxX, maxY };
}

function fitView() {
  const b = computeBounds();
  const rect = canvas.getBoundingClientRect();
  if (!b) { view = { scale: 1, ox: rect.width / 2, oy: rect.height / 2 }; return; }
  const w = b.maxX - b.minX || 1;
  const h = b.maxY - b.minY || 1;
  const pad = 50;
  const scale = Math.min((rect.width - pad * 2) / w, (rect.height - pad * 2) / h);
  view.scale = isFinite(scale) && scale > 0 ? scale : 1;
  const cx = (b.minX + b.maxX) / 2;
  const cy = (b.minY + b.maxY) / 2;
  view.ox = rect.width / 2 - cx * view.scale;
  view.oy = rect.height / 2 + cy * view.scale; // y 反転
}

// モデル座標 (X=東/右, Y=北/上) -> 画面座標
function tx(x) { return x * view.scale + view.ox; }
function ty(y) { return -y * view.scale + view.oy; }
function mxFromScreen(sx) { return (sx - view.ox) / view.scale; }
function myFromScreen(sy) { return -(sy - view.oy) / view.scale; }

// ===========================================================================
// 描画
// ===========================================================================
function draw() {
  const rect = canvas.getBoundingClientRect();
  ctx.clearRect(0, 0, rect.width, rect.height);
  if (mode === "trc") drawTrc();
  else if (mode === "dxf") drawDxf();
}

function drawDxf() {
  // cad-trcad と同じく白背景・黒線
  ctx.lineWidth = 1;
  ctx.strokeStyle = "#000000";
  ctx.fillStyle = "#000000";

  for (const e of entities) {
    ctx.beginPath();
    switch (e.type) {
      case "LINE":
        ctx.moveTo(tx(e.props.x), ty(e.props.y));
        ctx.lineTo(tx(e.props.x2), ty(e.props.y2));
        ctx.stroke();
        break;
      case "CIRCLE":
        ctx.arc(tx(e.props.x), ty(e.props.y), e.props.r * view.scale, 0, Math.PI * 2);
        ctx.stroke();
        break;
      case "ARC": {
        const a0 = -e.props.endAngle * Math.PI / 180;
        const a1 = -e.props.startAngle * Math.PI / 180;
        ctx.arc(tx(e.props.x), ty(e.props.y), e.props.r * view.scale, a0, a1);
        ctx.stroke();
        break;
      }
      case "LWPOLYLINE":
      case "POLYLINE": {
        if (e.vertices.length) {
          ctx.moveTo(tx(e.vertices[0].x), ty(e.vertices[0].y));
          for (let k = 1; k < e.vertices.length; k++)
            ctx.lineTo(tx(e.vertices[k].x), ty(e.vertices[k].y));
          if (e.props.flags & 1) ctx.closePath();
          ctx.stroke();
        }
        break;
      }
      case "POINT":
        ctx.arc(tx(e.props.x), ty(e.props.y), 2, 0, Math.PI * 2);
        ctx.fill();
        break;
      case "TEXT":
      case "MTEXT": {
        if (e.props.text != null) {
          const size = Math.max(8, (e.props.height || 1) * view.scale);
          ctx.save();
          ctx.font = size + "px sans-serif";
          ctx.fillText(e.props.text, tx(e.props.x), ty(e.props.y));
          ctx.restore();
        }
        break;
      }
    }
  }
}

// cad-trcad (frmTrCAD.Redraw) の .NET 名前付き色を RGB で再現
const COL = {
  black: "#000000", blue: "#0000ff", green: "#008000", darkGreen: "#006400",
  lightPink: "#ffb6c1", brown: "#a52a2a", darkOliveGreen: "#556b2f",
  orange: "#ffa500", red: "#ff0000",
  lightSteelBlueThick: "#6699cc" /* FromArgb(102,153,204) */,
};
// レイヤー定数 (TrCADclass.Layer)
const L_KYOKAI = "K", L_SKETCH = "S", L_ROAD = "R", L_HOUSE = "H",
      L_GAIKO = "G", L_RINSETU = "I", L_YOBI = "Q", L_LEVEL = "L",
      L_DENCHU = "D", L_KYO = "Y";

// 線のペン (色 / 太さ / 破線パターン) を cad-trcad のレイヤー・スタイル分岐で決定
function trcLinePen(ln) {
  const lay = ln.layer, st = ln.style;
  // レベル(L)は最優先で濃緑 (スケッチでも緑)
  if (lay === L_LEVEL) return { color: COL.darkGreen, width: 1, dash: [] };
  if (ln.sketch) return sketchPen(st);
  switch (lay) {
    case L_DENCHU: return { color: COL.lightSteelBlueThick, width: 2, dash: [120, 10] };
    case L_YOBI:   return { color: COL.brown, width: 1, dash: [] };
    case L_KYOKAI: return { color: COL.blue, width: 1, dash: [40, 5, 5, 5] };
    case L_ROAD:
    case L_GAIKO:  return { color: COL.black, width: 1, dash: [] };
    case L_HOUSE:
    case L_RINSETU:
      return st === 3 ? { color: COL.green, width: 1, dash: [20, 5, 5, 5, 5, 5] }
                      : { color: COL.green, width: 1, dash: [10, 2] };
    case L_SKETCH: return sketchPen(st);
    default:
      if (st === 1) return { color: COL.black, width: 1, dash: [5, 5] };
      if (st === 2) return { color: COL.black, width: 1, dash: [40, 5] };
      return { color: COL.black, width: 1, dash: [] };
  }
}
function sketchPen(st) {
  if (st === 1) return { color: COL.lightPink, width: 1, dash: [5, 5] };
  if (st === 2) return { color: COL.lightPink, width: 1, dash: [40, 5] };
  if (st === 3) return { color: COL.lightPink, width: 1, dash: [20, 5, 5, 5, 5, 5] };
  return { color: COL.lightPink, width: 1, dash: [] };
}
function trcCircleColor(c) {
  switch (c.layer) {
    case L_KYOKAI: case L_KYO: return COL.blue;
    case L_HOUSE:  return COL.green;
    case L_SKETCH: return COL.lightPink;
    default:       return COL.black;
  }
}
function trcMojiColor(m) {
  switch (m.layer) {
    case L_KYOKAI: return COL.blue;
    case L_HOUSE:  return COL.green;
    case L_LEVEL:  return COL.darkGreen;
    case L_SKETCH: return COL.lightPink;
    default:       return COL.black;
  }
}

function drawTrc() {
  // 点と点名 (cad-trcad: 黒の × ±3px、点名は黒で View.X+2, View.Y-12)
  ctx.font = "12px 'MS UI Gothic','MS Gothic',monospace";
  const PT = 3;
  for (const p of trc.points) {
    if (p.del || p.notDisp) continue;
    if (p.name && p.name.charAt(0) === L_SKETCH) continue; // スケッチ記号の点は非表示
    const sx = tx(p.x), sy = ty(p.y);
    ctx.strokeStyle = COL.black;
    ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.moveTo(sx - PT, sy - PT); ctx.lineTo(sx + PT, sy + PT);
    ctx.moveTo(sx - PT, sy + PT); ctx.lineTo(sx + PT, sy - PT);
    ctx.stroke();
    if (chkLabel.checked && p.name) {
      ctx.fillStyle = COL.black;
      ctx.textAlign = "left"; ctx.textBaseline = "top";
      ctx.fillText(p.name, sx + 2, sy - 12);
    }
  }

  // 線 (点名 pnA/pnB を参照、レイヤー・スタイル別の色／破線)
  if (chkLine.checked) {
    for (const ln of trc.lines) {
      if (ln.del) continue;
      const a = trc.pointMap.get(ln.pnA), b = trc.pointMap.get(ln.pnB);
      if (!a || !b) continue;
      const pen = trcLinePen(ln);
      ctx.strokeStyle = pen.color;
      ctx.lineWidth = pen.width;
      ctx.setLineDash(pen.dash);
      ctx.beginPath();
      ctx.moveTo(tx(a.x), ty(a.y));
      ctx.lineTo(tx(b.x), ty(b.y));
      ctx.stroke();
    }
    ctx.setLineDash([]);
    ctx.lineWidth = 1;
  }

  // 円 (レイヤー別の色、塗りつぶし／写真円対応)
  for (const c of trc.circles) {
    if (c.del) continue;
    const sx = tx(c.x), sy = ty(c.y), r = Math.max(1, c.r * view.scale);
    ctx.beginPath();
    ctx.arc(sx, sy, r, 0, Math.PI * 2);
    if (c.sketch) {
      ctx.strokeStyle = COL.lightPink; ctx.lineWidth = 1; ctx.stroke();
    } else if (c.fill) {
      ctx.fillStyle = trcCircleColor(c); ctx.fill();
    } else if (c.photo) {
      ctx.strokeStyle = COL.orange; ctx.lineWidth = 2; ctx.stroke(); ctx.lineWidth = 1;
    } else {
      ctx.strokeStyle = trcCircleColor(c); ctx.lineWidth = 1; ctx.stroke();
    }
  }

  // ポリライン (黒、スケッチはピンク)
  ctx.lineWidth = 1;
  for (const pl of trc.plines) {
    if (pl.del || pl.pts.length < 2) continue;
    ctx.strokeStyle = pl.sketch ? COL.lightPink : COL.black;
    ctx.beginPath();
    ctx.moveTo(tx(pl.pts[0].x), ty(pl.pts[0].y));
    for (let k = 1; k < pl.pts.length; k++) ctx.lineTo(tx(pl.pts[k].x), ty(pl.pts[k].y));
    ctx.stroke();
  }

  // 文字 (レイヤー別色・中央寄せ・文字高さ反映・角度回転)
  if (chkMoji.checked) {
    ctx.textAlign = "center"; ctx.textBaseline = "middle";
    for (const m of trc.mojis) {
      if (m.del || !m.text) continue;
      const hMM = (m.height && m.height > 0) ? m.height : 200; // 既定 200
      const px = Math.max(1, (hMM / 1000) * view.scale);       // mm→モデル単位(m)→画面px
      ctx.fillStyle = trcMojiColor(m);
      ctx.font = px + "px 'MS UI Gothic','MS Gothic',sans-serif";
      const sx = tx(m.x), sy = ty(m.y);
      if (m.angle) {
        ctx.save();
        ctx.translate(sx, sy);
        ctx.rotate(m.angle * Math.PI / 180); // 画面座標系(Y下)で時計回り
        ctx.fillText(m.text, 0, 0);
        ctx.restore();
      } else {
        ctx.fillText(m.text, sx, sy);
      }
    }
    ctx.textAlign = "left"; ctx.textBaseline = "alphabetic";
  }

  // 図枠 (Block を Insert 位置・角度で配置、レイヤー別色)
  if (chkFrame.checked) {
    for (const ins of trc.inserts) {
      if (ins.del) continue;
      const blk = trc.blocks.get(ins.block);
      if (!blk || blk.pts.length < 2) continue;
      ctx.strokeStyle = ins.layer === "F" ? COL.black
                      : ins.layer === "S" ? COL.lightPink : COL.darkOliveGreen;
      ctx.lineWidth = 1;
      const rad = (ins.angle || 0) * Math.PI / 180;
      const cos = Math.cos(rad), sin = Math.sin(rad);
      ctx.beginPath();
      for (let k = 0; k < blk.pts.length; k++) {
        const bx = blk.pts[k].x, by = blk.pts[k].y;
        const rx = bx * cos - by * sin, ry = bx * sin + by * cos; // 原点まわり回転
        const X = tx(ins.x + rx), Y = ty(ins.y + ry);
        if (k === 0) ctx.moveTo(X, Y); else ctx.lineTo(X, Y);
      }
      ctx.stroke();
    }
  }

  // 生垣ライン (cad-trcad と同じ赤い植栽記号: 半円弧の連続)
  ctx.strokeStyle = COL.red;
  ctx.fillStyle = COL.red;
  ctx.lineWidth = 1;
  for (const h of trc.hedges) {
    if (h.del) continue;
    drawHedge(tx(h.x1), ty(h.y1), tx(h.x2), ty(h.y2));
  }
}

// 生垣記号 — frmTrCAD.Redraw の生垣描画を画面座標で移植
function drawHedge(x1, y1, x2, y2) {
  const len = Math.hypot(x2 - x1, y2 - y1);
  if (len < 1) return;
  const cntIk = Math.floor(len / 38) + 1;
  const unt = (len / cntIk) / 3.8;
  const rad = Math.atan2(y2 - y1, x2 - x1);
  const pv = (v, r, d) => ({ x: v.x + Math.cos(r) * d, y: v.y + Math.sin(r) * d });
  const dot = (v) => { ctx.beginPath(); ctx.arc(v.x, v.y, 1, 0, Math.PI * 2); ctx.stroke(); };
  const arc = (cx, cy, a0deg) => {
    ctx.save();
    ctx.translate(cx, cy);
    ctx.rotate(rad + Math.PI / 4); // ToDegree(slineRadian)+45°
    ctx.beginPath();
    ctx.arc(0, 0, unt, a0deg * Math.PI / 180, (a0deg + 90) * Math.PI / 180, false);
    ctx.stroke();
    ctx.restore();
  };
  let viewS = { x: x1, y: y1 };
  for (let i = 0; i < cntIk; i++) {
    const viewA = pv(viewS, rad, unt / 2);
    const viewB = pv(viewA, rad - Math.PI / 4, unt);
    const viewC = pv(viewB, rad + Math.PI / 4, unt * 2);
    const viewD = pv(viewC, rad - Math.PI / 4, unt);
    const viewE = pv(viewD, rad, unt / 2);
    dot(viewS); dot(viewE);
    arc(viewB.x, viewB.y, 0);
    arc(viewC.x, viewC.y, 180);
    viewS = viewE;
  }
}

// 与点チェック — cad-trcad frmTrCAD.YotenCalc / GetList_YotenCheck を移植。
//   既知点を再観測する際は 点番=元番号+300 で付与（例 K1→K301）。
//   与点(数値部>300 かつ 英字+(数値-300) が存在)と基準点の距離を求める。
//   点番が "_" で始まるものは対象外。Map(与点名 → 距離m) を返す。
const SURVEY_YOTEN_LIMIT = 0.02; // 20mm = 2cm (frmTrCAD._YotenDistThreshold)

function computeYotenCheck() {
  const map = new Map();
  const pm = trc.pointMap || new Map();
  for (const p of trc.points) {
    const nm = p.name || "";
    if (nm.charAt(0) === "_") continue;
    const abc = nm.replace(/[0-9]/g, "");
    const numStr = nm.replace(/[^0-9]/g, "");
    if (numStr === "") continue;
    let num = parseInt(numStr, 10);
    if (!(num > 300)) continue;
    let ref = null;
    while (num - 300 > 0) {              // 300 を繰り返し引くケースも考慮
      const rp = pm.get(abc + (num - 300));
      if (rp) ref = rp;
      num -= 300;
    }
    if (ref) map.set(nm, Math.hypot(ref.x - p.x, ref.y - p.y));
  }
  return map;
}

function surveyHtml() {
  if (!trc.surveyData.length) return '<div class="empty">データなし</div>';
  const yoten = computeYotenCheck();
  let overCount = 0;
  let html = "<table><tr><th>器械点</th><th>後視点</th><th>測点</th><th>水</th><th>平</th><th>角</th><th>距離</th><th>誤差</th></tr>";
  for (const s of trc.surveyData) {
    let errCell = `<td>${esc(s.err)}</td>`;
    const d = yoten.get(s.sokuten);
    if (d != null) {
      const over = d >= SURVEY_YOTEN_LIMIT;
      if (over) overCount++;
      errCell = `<td class="${over ? "err" : ""}">${d.toFixed(3)}</td>`;
    }
    html += `<tr><td class="l">${esc(s.ip)}</td><td class="l">${esc(s.bs)}</td><td class="l">${esc(s.sokuten)}</td>`
          + `<td>${esc(s.sui)}</td><td>${esc(s.hei)}</td><td>${esc(s.kaku)}</td><td>${esc(s.dist)}</td>${errCell}</tr>`;
  }
  html += "</table>";
  html += `<p class="note">誤差=与点チェック（点番+300 で再観測した既知点と元点の距離 m）。`
        + `|誤差| ≧ ${SURVEY_YOTEN_LIMIT * 1000}mm で許容超過（赤）。</p>`;
  if (overCount > 0) html += `<p class="note" style="color:#f08a8a">⚠ 与点の許容超過が ${overCount} 件あります。</p>`;
  return html;
}

function levelHtml() {
  if (!trc.levels.length) return '<div class="empty">データなし</div>';
  const calc = computeLevels(trc.levels);
  let ckErrors = 0;
  let html = "<table><tr><th>測点</th><th>BS(後視)</th><th>FS(前視)</th><th>TP(中間)</th>"
           + "<th>高さ(GH)</th><th>CK(較差)</th><th>備考</th></tr>";
  for (const r of calc) {
    let ghCell = '<td class="empty"></td>';
    if (r.gh != null && isFinite(r.gh)) {
      const cls = r.gh > 0 ? "plus" : (r.gh < 0 ? "minus" : "");
      const sign = r.gh > 0 ? "＋" + r.gh : (r.gh < 0 ? "－" + Math.abs(r.gh) : "±0");
      ghCell = `<td class="${cls}">${sign}</td>`;
    }
    let ckCell = '<td class="empty"></td>';
    if (r.ck != null) {
      if (r.ckError) ckErrors++;
      ckCell = `<td class="${r.ckError ? "err" : ""}">${r.ck}</td>`;
    }
    html += `<tr><td class="l">${esc(r.name)}</td><td>${esc(r.bs)}</td><td>${esc(r.fs)}</td>`
          + `<td>${esc(r.tp)}</td>${ghCell}${ckCell}<td class="l">${esc(r.remarks)}</td></tr>`;
  }
  html += "</table>";
  html += '<p class="note">高さ(GH)は基準点を ±0 とした相対値（mm）。Tr-CAD 器械高式で再計算。</p>';
  html += `<p class="note">CK(較差)=確定済み同名点との GH 差。|較差| ≧ ${LEVEL_YOTEN_LIMIT}mm で不一致（赤）。</p>`;
  if (ckErrors > 0) {
    html += `<p class="note" style="color:#f08a8a">⚠ 与点の高さが合っていない点が ${ckErrors} 件あります。</p>`;
  }
  return html;
}

// ===========================================================================
// まわりけん（境界一覧）— cad-trcad frmTrCAD.ShowData_dgvMawarikenCheck を移植
//   境界点 K<n>(n≤300) を K1→K2…→Kmax→K1 と連結し、計算値=隣接間距離(m)。
//   入力値は *Mawariken-Section* から取得。誤差=|入力-計算|×1000(mm)。
//   判定: ≦20mm 〇 / ≦50mm △ / >50mm × / 入力空 未判定 / 数値でない・計算不可 −
// ===========================================================================
function mawarikenHtml() {
  // 境界点 K<n> (n≤300) を収集
  const kpts = new Map();
  let kMax = 0;
  for (const p of trc.points) {
    const mm = /^K(\d+)$/.exec(p.name || "");
    if (!mm) continue;
    const n = parseInt(mm[1], 10);
    if (n > 300) continue;
    kpts.set(n, p);
    if (n > kMax) kMax = n;
  }
  if (kMax < 2) return '<div class="empty">境界点（K1, K2 …）がありません</div>';

  const dist = (a, b) => Math.sqrt((a.x - b.x) ** 2 + (a.y - b.y) ** 2);
  const inputMap = new Map(trc.mawariken.map(m => [m.kyokai, m]));

  // 行リストを構築（K1-K2 … Kmax-1-Kmax、kMax≧3 なら Kmax-K1 で閉合）
  const rows = [];
  for (let k = 1; k <= kMax - 1; k++) {
    rows.push({ start: "K" + k, end: "K" + (k + 1), sp: kpts.get(k), ep: kpts.get(k + 1) });
    if (k === kMax - 1 && kMax >= 3) {
      rows.push({ start: "K" + kMax, end: "K1", sp: kpts.get(kMax), ep: kpts.get(1) });
    }
  }

  let ngCount = 0;
  let html = "<table><tr><th>境界</th><th>計算値</th><th>まわりけん</th><th>誤差(m)</th><th>不能</th></tr>";
  for (const r of rows) {
    const kyokai = r.start + " - " + r.end;
    const calcStr = (r.sp && r.ep) ? dist(r.sp, r.ep).toFixed(3) : "";
    const mk = inputMap.get(kyokai) || inputMap.get(r.start + " - " + r.end);
    const input = mk ? (mk.input || "") : "";
    const unable = mk ? mk.unable : false;

    // 判定・誤差（trcad GetMawarikenGosa / GetMawarikenHantei）
    let gosaCell = '<td class="empty"></td>';
    if (unable) {
      gosaCell = '<td class="mk-ng">不可</td>';
    } else if (input.trim() === "") {
      gosaCell = '<td class="empty"></td>'; // 未判定
    } else if (isNaN(Number(input)) || calcStr === "") {
      gosaCell = '<td class="mk-ng">－</td>'; ngCount++;
    } else {
      const keisan = Number(calcStr);
      const gosaMm = Math.abs(Number(input) - keisan) * 1000;
      const gosaInt = Math.round(gosaMm);
      if (gosaMm <= 20) gosaCell = `<td class="mk-ok">${(gosaInt / 1000).toFixed(3)}</td>`;
      else if (gosaMm <= 50) gosaCell = `<td class="mk-warn">${(gosaInt / 1000).toFixed(3)}</td>`;
      else { gosaCell = '<td class="mk-ng">Over</td>'; ngCount++; }
    }

    html += `<tr><td class="l">${esc(kyokai)}</td><td>${esc(calcStr)}</td>`
          + `<td>${esc(input)}</td>${gosaCell}<td>${unable ? "✓" : ""}</td></tr>`;
  }
  html += "</table>";
  html += '<p class="note">計算値=隣接境界点間の距離(m)。誤差=|まわりけん入力−計算値|。'
        + '<span class="mk-ok">〇≦20mm</span> / <span class="mk-warn">△≦50mm</span> / '
        + '<span class="mk-ng">×&gt;50mm・判定不可</span>。</p>';
  if (ngCount > 0) html += `<p class="note" style="color:#f08a8a">⚠ 許容超過・判定不可が ${ngCount} 件あります。</p>`;
  return html;
}

function renderPanel() {
  if (!mode) { panel.innerHTML = ""; return; }

  if (mode === "dxf") {
    const counts = {};
    for (const e of entities) counts[e.type] = (counts[e.type] || 0) + 1;
    let html = "<h2>DXF エンティティ</h2><table><tr><th>種類</th><th>数</th></tr>";
    for (const k of Object.keys(counts).sort())
      html += `<tr><td class="l">${esc(k)}</td><td>${counts[k]}</td></tr>`;
    html += `<tr><td class="l">合計</td><td>${entities.length}</td></tr></table>`;
    panel.innerHTML = html;
    return;
  }

  // TRC: 図形 / 測角データ / レベル（水準）を別タブ（別画面）に分離
  const tabs = [
    { key: "overview", label: "概要" },
    { key: "mawari", label: "まわりけん" },
    { key: "survey", label: "測角データ" },
    { key: "level",  label: "レベル（水準）" },
    { key: "raw",    label: "TRCデータ" },
    { key: "shape",  label: "図形" },
  ];
  let html = '<div class="tabs">';
  for (const t of tabs) {
    html += `<button class="tab${activeTab === t.key ? " active" : ""}" data-tab="${t.key}">${t.label}</button>`;
  }
  html += "</div><div class=\"tabBody\">";
  if (activeTab === "overview")    html += overviewHtml();
  else if (activeTab === "survey") html += surveyHtml();
  else if (activeTab === "level")  html += levelHtml();
  else if (activeTab === "mawari") html += mawarikenHtml();
  else if (activeTab === "raw")    html += rawTextHtml();
  else                             html += shapeHtml();
  html += "</div>";
  panel.innerHTML = html;

  panel.querySelectorAll(".tab").forEach(btn =>
    btn.addEventListener("click", () => { activeTab = btn.dataset.tab; renderPanel(); })
  );
}

function updatePanelVisibility() {
  // 右ペインは常時表示 (読込前は空)
  panel.classList.remove("hidden");
}

// ファイル読み込み
// ===========================================================================
function decodeText(buf) {
  const u8 = new Uint8Array(buf);
  try { return new TextDecoder("utf-8", { fatal: false }).decode(u8); }
  catch (e) { return new TextDecoder("shift_jis", { fatal: false }).decode(u8); }
}

function loadDxf(text, name) {
  mode = "dxf";
  entities = parseDxf(text);
  trc = null;
  controls.classList.add("hidden");
  renderPanel();
  finishLoad(name, `${entities.length} エンティティ`);
}

function loadTrc(parsed, name) {
  mode = "trc";
  trc = parsed;
  entities = [];
  controls.classList.remove("hidden");
  activeTab = "overview";
  renderPanel();
  const dispPts = trc.points.filter(p => !p.notDisp).length;
  finishLoad(name, `点 ${dispPts} / 線 ${trc.lines.length} / 円 ${trc.circles.length} / 文字 ${trc.mojis.length}`);
}

function finishLoad(name, summary) {
  hasData = true;
  currentName = name;
  dropEl.classList.add("hidden");
  dropEl.classList.remove("empty");
  saveBtn.classList.remove("hidden");
  // レベルExcel出力・一括出力は TRC でレベルデータがある場合のみ
  const hasLevel = mode === "trc" && trc && trc.levels.length > 0;
  levelXlsxBtn.classList.toggle("hidden", !hasLevel);
  bothBtn.classList.toggle("hidden", !hasLevel);
  viewToggle.classList.remove("hidden");
  mainEl.classList.remove("view-panel"); // 読込時はまず図面を全面表示 (スマホ)
  viewToggle.textContent = "📋 データ";
  updatePanelVisibility();
  resizeCanvas();
  fitView();
  draw();
  info.textContent = `${name} — ${mode.toUpperCase()} / ${summary}`;
}

async function handleFile(file) {
  if (!file) return;
  const ext = (file.name.split(".").pop() || "").toLowerCase();
  try {
    const buf = await file.arrayBuffer();
    if (ext === "trc") {
      const text = await readTrcText(buf);
      trcRawText = text;
      loadTrc(parseTrc(text), file.name);
    } else {
      const text = decodeText(buf);
      loadDxf(text, file.name);
    }
  } catch (err) {
    alert("解析に失敗しました: " + (err && err.message ? err.message : err));
  }
}

// ===========================================================================
// DXF 書き出し (R12 ASCII) — cad-trcad frmTrCAD の DXF 出力を参考に実装
//   座標は (値 - 最小) * 1000 (m→mm)。レイヤー先頭文字 K→KYO-0/R→KYO/H→TATEMONO/他→COUI
// ===========================================================================
const DXF_SCALE = 1000;
const DXF_BOUNDARY_RADIUS = 0.025; // _BoundaryDiameter(50) / 2000
const DXF_SKETCH_SYMBOL = "_";     // _Project.SketchSymbol 既定

// レイヤーコード(先頭1文字) → DXF画層 （cad-trcad frmTrCAD DXF出力の振り分けを移植）
//   K=境界 S=スケッチ F=フリー R=道路 H=家屋 G=外構 I=隣接 Q=予備 L=レベル
//   D=電柱 Z=更地 B=設備 T=既存家屋 M=家屋 Y=道路(L側溝) U=ブロック
function dxfLineLayer(layer) {

    case "D": return "DENCHU";
    case "R": return "KYO";
    case "H": return "TATEMONO";

    case "U": return "SETUBI2";
    case "I": return "TATEMONO2";
    case "G": return "COUI";
    case "Q": return "COUZOU";
    case "Y": return "KYO";
    default:  return "COUI";
  }
}

    case "Y": return "KYO";
    case "B": return "SETUBI";

    case "T": return "TATEMONO";

    case "S": return "RED";

function trcToDxf(trc) {
  // 座標基準: 表示点 + 非削除線の端点 から最小値-3 （cad-trcad と同じ）
  let minX = Infinity, minY = Infinity;
  const ext = (x, y) => { if (x < minX) minX = x; if (y < minY) minY = y; };
  for (const p of trc.points) if (!p.notDisp) ext(p.x, p.y);
  for (const ln of trc.lines) {
    if (ln.del) continue;
    const a = trc.pointMap.get(ln.pnA), b = trc.pointMap.get(ln.pnB);
    if (a) ext(a.x, a.y); if (b) ext(b.x, b.y);
  }
  if (!isFinite(minX)) { minX = 3; minY = 3; }
  minX -= 3; minY -= 3;
  const X = (x) => ((x - minX) * DXF_SCALE).toFixed(3);
  const Y = (y) => ((y - minY) * DXF_SCALE).toFixed(3);

  const ent = [];
  const blocks = []; // BLOCKS セクション用 {name, lines:[[x1,y1,x2,y2]]}

  // 点（＋点名 TEXT）
  for (const p of trc.points) {
    if ((p.notDisp || p.sketch) && !p.yoten) continue;
    if (!p.name) continue;
    if (p.name.charAt(0).toUpperCase() === DXF_SKETCH_SYMBOL) continue;
    ent.push("0","POINT","8","0","10",X(p.x),"20",Y(p.y),"30","0.0");
    ent.push("0","TEXT","8","0",
      "10",((p.x - minX) * DXF_SCALE - (150 + 250 * (p.name.length - 1))).toFixed(3),
      "20",((p.y - minY) * DXF_SCALE + 300).toFixed(3),"30","0.0",
      "40","500.0","1",p.name,"7","Standard");
  }

  // 線（境界K/スケッチS/レベルL は出力しない）
  for (const ln of trc.lines) {
    if (ln.del || ln.sketch) continue;
    const c0 = (ln.layer || "").charAt(0);
    if (c0 === "S" || c0 === "K" || c0 === "L") continue;
    const a = trc.pointMap.get(ln.pnA), b = trc.pointMap.get(ln.pnB);
    if (!a || !b) continue;
    ent.push("0","LINE","8",dxfLineLayer(ln.layer));
    if (ln.style === 1) ent.push("6","HIDDEN-2");
    else if (ln.style === 2) ent.push("6","DASHED-2");
    else if (ln.style === 3) ent.push("6","DASHED-4");
    ent.push("10",X(a.x),"20",Y(a.y),"30","0.0","11",X(b.x),"21",Y(b.y),"31","0.0");
  }

  // 円（境界K・スケッチ除外。境界点の塗り●は LWPOLYLINE）
  for (const c of trc.circles) {
    if (c.del || c.sketch) continue;
    const c0 = (c.layer || "").charAt(0);
    if (c0 === "S" || c0 === "K") continue;
    if (Math.abs(c.r - DXF_BOUNDARY_RADIUS) < 1e-6 && c.fill === 1) {
      const cx = (c.x - minX) * DXF_SCALE, cy = (c.y - minY) * DXF_SCALE;
      const lay = (c.pointName || "").charAt(0).toUpperCase() === "K" ? "KYOMOJI" : "KYO";
      ent.push("0","LWPOLYLINE","8",lay,"90","2","70","1","43","75.0",
        "10",(cx - 37.5).toFixed(3),"20",cy.toFixed(3),"42","1.0",
        "10",(cx + 37.5).toFixed(3),"20",cy.toFixed(3),"42","1.0");
    } else {
      ent.push("0","CIRCLE","8",dxfCircleLayer(c.layer),
        "10",X(c.x),"20",Y(c.y),"30","0.0","40",(c.r * DXF_SCALE).toFixed(3));
    }
  }

  // 文字（スケッチS・レベルL 除外。空文字も trcad は出力する）
  for (const m of trc.mojis) {
    if (m.del || m.sketch) continue;
    const c0 = (m.layer || "").charAt(0);
    if (c0 === "S" || c0 === "L") continue;
    if (m.text == null) m.text = "";
    const lay = dxfMojiLayer(m.layer);
    const rows = String(m.text).split(/\r?\n/);
    if (rows.length > 1) {
      // 複数行: 1行ずつ TEXT（座標は近似。GDI実測に依存する部分は再現不可）
      const LS = 265;
      rows.forEach((row, i) => {
        ent.push("0","TEXT","8",lay,
          "10",X(m.x),"20",((m.y - minY) * DXF_SCALE + (rows.length * LS) / 2 - i * LS - 185).toFixed(3),
          "30","0.0","40","200.0","1",row.trim(),"72","0","7","MSPGothic");
      });
    } else {
      ent.push("0","TEXT","8",lay,
        "10",X(m.x),"20",Y(m.y),"30","0.0","40","200.0","1",m.text);
      if (m.angle) ent.push("50",String(360 - m.angle));
      ent.push("72","4","11",X(m.x),"21",Y(m.y),"7","MSPGothic");
    }
  }

  // インサート（ブロック参照）
  for (const ins of trc.inserts) {
    if (ins.del || ins.sketch) continue;
    const blk = trc.blocks.get(ins.block);
    if (!blk || blk.pts.length === 0) continue;
    const bname = ins.block === "Uekomi" ? "KABU1" : ins.block;
    ent.push("0","INSERT","8",dxfInsertLayer(ins.layer),"2",bname,
      "10",X(ins.x),"20",Y(ins.y),"30","0.0");
    if (ins.angle) ent.push("50",String(-ins.angle));
  }

  // ポリライン → ブロック定義＋INSERT （cad-trcad と同じ構造）
  for (const pl of trc.plines) {
    if (pl.del || pl.pts.length < 2) continue;
    if ((pl.name || "").indexOf("PMADO") === 0) continue;
    const lines = [];
    for (let i = 1; i < pl.pts.length; i++) {
      const a = pl.pts[i - 1], b = pl.pts[i];
      lines.push([((a.x - minX) * DXF_SCALE).toFixed(3), ((a.y - minY) * DXF_SCALE).toFixed(3),
                  ((b.x - minX) * DXF_SCALE).toFixed(3), ((b.y - minY) * DXF_SCALE).toFixed(3)]);
    }
    blocks.push({ name: pl.name, lines });
    ent.push("0","INSERT","8","0","2",pl.name,"10","0.0","20","0.0","30","0.0");
  }

  // コメント → MTEXT （Check=True を SortNum 順。位置は近似）
  const comments = trc.comments.filter(c => c.check).sort((a, b) => a.sort - b.sort);
  if (comments.length) {
    let maxX = -Infinity, maxY = -Infinity;
    for (const p of trc.points) if (!p.notDisp) { if (p.x > maxX) maxX = p.x; if (p.y > maxY) maxY = p.y; }
    if (!isFinite(maxX)) { maxX = minX; maxY = minY; }
    let posY = (maxY - minY) * DXF_SCALE;
    const posX = (maxX - minX) * DXF_SCALE + 3000;
    for (const c of comments) {
      const mtext = String(c.text).replace(/\|/g, "\\P");
      ent.push("0","MTEXT","8","TEXT","10",posX.toFixed(3),"20",posY.toFixed(3),"30","0.0",
        "40","250.0","1",mtext);
      posY -= (String(c.text).split("|").length * 250 + 800);
    }
  }

  // 組み立て: HEADER/TABLES + BLOCKS + ENTITIES + EOF
  const out = dxfHeaderTables();
  out.push("0","SECTION","2","BLOCKS");
  for (const blk of blocks) {
    out.push("0","BLOCK","8","0","2",blk.name,"70","0","10","0.0","20","0.0","30","0.0","3",blk.name);
    for (const [x1, y1, x2, y2] of blk.lines) {
      out.push("0","LINE","8","0","10",x1,"20",y1,"30","0.0","11",x2,"21",y2,"31","0.0");
    }
    out.push("0","ENDBLK","8","0");
  }
  out.push("0","ENDSEC","0","SECTION","2","ENTITIES");
  out.push(...ent);
  out.push("0","ENDSEC","0","EOF");
  return out.join("\r\n") + "\r\n";
}

function entitiesToDxf(entities) {
  let cnt = 256;
  const h = () => (cnt++).toString(16).toUpperCase();
  const body = [];
  const f = (v) => (v == null ? "0.0" : Number(v).toFixed(3));
  for (const e of entities) {
    const lay = e.props.layer || "0";
    switch (e.type) {
      case "LINE":
        body.push("0","LINE","8",lay,"5",h(),
          "10",f(e.props.x),"20",f(e.props.y),"30","0.0",
          "11",f(e.props.x2),"21",f(e.props.y2),"31","0.0");
        break;
      case "CIRCLE":
        body.push("0","CIRCLE","8",lay,"5",h(),
          "10",f(e.props.x),"20",f(e.props.y),"30","0.0","40",f(e.props.r));
        break;
      case "ARC":
        body.push("0","ARC","8",lay,"5",h(),
          "10",f(e.props.x),"20",f(e.props.y),"30","0.0","40",f(e.props.r),
          "50",f(e.props.startAngle),"51",f(e.props.endAngle));
        break;
      case "POINT":
        body.push("0","POINT","8",lay,"5",h(),"10",f(e.props.x),"20",f(e.props.y),"30","0.0");
        break;
      case "TEXT":
      case "MTEXT":
        body.push("0","TEXT","8",lay,"5",h(),"10",f(e.props.x),"20",f(e.props.y),"30","0.0",
          "40",f(e.props.height || 200),"1",e.props.text || "","7","STANDARD");
        break;
      case "LWPOLYLINE":
      case "POLYLINE":
        if (e.vertices.length >= 2)
          pushPolyline(body, h, e.vertices.map(v => ({ x: f(v.x), y: f(v.y) })), lay, !!(e.props.flags & 1));
        break;
    }
  }
  const out = dxfHeaderTables();
  out.push("0","SECTION","2","ENTITIES");
  out.push(...body);
  out.push("0","ENDSEC","0","EOF");
  return out.join("\r\n") + "\r\n";
}

// ===========================================================================
// DXF 出力 (AC1015 / AutoCAD 2000) — cad-trcad の DXF 出力に構造まで合わせる版
//   雛形 dxf-template.txt (HEADER/CLASSES/TABLES/BLOCKS/OBJECTS) を読み込み、
//   ハンドル・サブクラスマーカー付きでエンティティを差し込む。
//   座標は (値-最小)*1000。小数は toPrecision(15) で TRC が保持する精度に合わせる
//   (trcad の .NET Decimal 内部精度の末尾桁は TRC に情報が無いため再現不可)。
// ===========================================================================
let _dxfTemplate = null;
async function loadDxfTemplate() {
  if (_dxfTemplate) return _dxfTemplate;
  const res = await fetch("dxf-template.txt");
  if (!res.ok) throw new Error("dxf-template.txt 読込失敗 (HTTP " + res.status + ")");
  const txt = await res.text();
  const T = {};
  const parts = txt.split(/@@@([A-Z0-9]+)@@@\r?\n/);
  for (let i = 1; i < parts.length; i += 2) T[parts[i]] = parts[i + 1];
  _dxfTemplate = T;
  return T;
}

// (値) を有効15桁に丸めた数値文字列に（double ノイズ桁を除去し trcad 前方桁に一致）
function dxfNum(v) {
  if (!isFinite(v)) return "0";
  const n = Number(v.toPrecision(15));
  return Object.is(n, -0) ? "0" : String(n);
}

async function trcToDxfFull(trc) {
  const T = await loadDxfTemplate();

  // 座標基準: 表示点 + 非削除線の端点 の最小値 - 3
  let minX = Infinity, minY = Infinity;
  for (const p of trc.points) if (!p.notDisp) { if (p.x < minX) minX = p.x; if (p.y < minY) minY = p.y; }
  for (const ln of trc.lines) {
    if (ln.del) continue;
    const a = trc.pointMap.get(ln.pnA), b = trc.pointMap.get(ln.pnB);
    if (a) { if (a.x < minX) minX = a.x; if (a.y < minY) minY = a.y; }
    if (b) { if (b.x < minX) minX = b.x; if (b.y < minY) minY = b.y; }
  }
  if (!isFinite(minX)) { minX = 3; minY = 3; }
  minX -= 3; minY -= 3;
  const X = (x) => dxfNum((x - minX) * 1000);
  const Y = (y) => dxfNum((y - minY) * 1000);

  let cnt = 300;
  const H = () => String(cnt++);

  const out = [];
  const push = (...a) => { for (const v of a) out.push(v); };
  const pushTmpl = (s) => { for (const ln of (s || "").replace(/\r?\n$/, "").split(/\r?\n/)) out.push(ln); };

  // 出力対象のポリライン/ブロック
  const plines = trc.plines.filter(p => !p.del && p.pts.length >= 2 && (p.name || "").indexOf("PMADO") !== 0);
  const usedBlocks = [];
  const seenBlk = new Set();
  for (const ins of trc.inserts) {
    if (ins.del || ins.sketch) continue;
    const blk = trc.blocks.get(ins.block);
    if (blk && blk.pts.length && !seenBlk.has(ins.block)) { seenBlk.add(ins.block); usedBlocks.push(blk); }
  }

  // 1) HEADER / CLASSES（雛形・完結）
  pushTmpl(T.HEADERSECTION00);
  pushTmpl(T.CLASSESSECTION00);

  // 2) TABLES（雛形は BLOCK_RECORD テーブルを開いた状態で終了）→ 動的 BLOCK_RECORD
  pushTmpl(T.TABLESSECTION00);
  for (const pl of plines) push("0", "BLOCK_RECORD", "5", H(), "100", "AcDbSymbolTableRecord", "100", "AcDbBlockTableRecord", "2", pl.name);
  for (const blk of usedBlocks) push("0", "BLOCK_RECORD", "5", H(), "100", "AcDbSymbolTableRecord", "100", "AcDbBlockTableRecord", "2", blk.name);
  push("0", "ENDTAB", "0", "ENDSEC");

  // 3) BLOCKS（雛形は *Paper_Space まで）→ 動的ブロック
  pushTmpl(T.BLOCKSSECTION00);
  const blockDef = (name, segs) => {
    push("0", "BLOCK", "5", H(), "100", "AcDbEntity", "8", "0", "100", "AcDbBlockBegin",
      "2", name, "70", "0", "10", "0.0", "20", "0.0", "30", "0.0", "3", name, "1", "");
    for (const [x1, y1, x2, y2] of segs)
      push("0", "LINE", "5", H(), "100", "AcDbEntity", "8", "0", "100", "AcDbLine",
        "10", x1, "20", y1, "30", "0.0", "11", x2, "21", y2, "31", "0.0");
    push("0", "ENDBLK", "5", H(), "100", "AcDbEntity", "8", "0", "100", "AcDbBlockEnd");
  };
  for (const pl of plines) {
    const segs = [];
    for (let i = 1; i < pl.pts.length; i++)
      segs.push([X(pl.pts[i - 1].x), Y(pl.pts[i - 1].y), X(pl.pts[i].x), Y(pl.pts[i].y)]);
    blockDef(pl.name, segs);
  }
  for (const blk of usedBlocks) {
    const segs = [];
    for (let i = 1; i < blk.pts.length; i++)
      segs.push([dxfNum(blk.pts[i - 1].x * 1000), dxfNum(blk.pts[i - 1].y * 1000),
                 dxfNum(blk.pts[i].x * 1000), dxfNum(blk.pts[i].y * 1000)]);
    blockDef(blk.name, segs);
  }
  push("0", "ENDSEC");

  // 4) ENTITIES
  push("0", "SECTION", "2", "ENTITIES");

  for (const p of trc.points) {
    if ((p.notDisp || p.sketch) && !p.yoten) continue;
    if (!p.name) continue;
    if (p.name.charAt(0).toUpperCase() === DXF_SKETCH_SYMBOL) continue;
    push("0", "POINT", "5", H(), "100", "AcDbEntity", "8", "0", "100", "AcDbPoint",
      "10", X(p.x), "20", Y(p.y), "30", "0.0");
    push("0", "TEXT", "5", H(), "100", "AcDbEntity", "8", "0", "100", "AcDbText",
      "10", dxfNum((p.x - minX) * 1000 - (150 + 250 * (p.name.length - 1))),
      "20", dxfNum((p.y - minY) * 1000 + 300), "30", "0.0",
      "40", "500.0", "1", p.name, "7", "Standard", "100", "AcDbText");
  }

  for (const ln of trc.lines) {
    if (ln.del || ln.sketch) continue;
    const c0 = (ln.layer || "").charAt(0);
    if (c0 === "S" || c0 === "K" || c0 === "L") continue;
    const a = trc.pointMap.get(ln.pnA), b = trc.pointMap.get(ln.pnB);
    if (!a || !b) continue;
    push("0", "LINE", "5", H(), "100", "AcDbEntity", "8", dxfLineLayer(ln.layer));
    if (ln.style === 1) push("6", "HIDDEN-2");
    else if (ln.style === 2) push("6", "DASHED-2");
    else if (ln.style === 3) push("6", "DASHED-4");
    push("100", "AcDbLine", "10", X(a.x), "20", Y(a.y), "30", "0.0", "11", X(b.x), "21", Y(b.y), "31", "0.0");
  }

  for (const c of trc.circles) {
    if (c.del || c.sketch) continue;
    const c0 = (c.layer || "").charAt(0);
    if (c0 === "S" || c0 === "K") continue;
    if (Math.abs(c.r - DXF_BOUNDARY_RADIUS) < 1e-6 && c.fill === 1) {
      const cx = (c.x - minX) * 1000, cy = (c.y - minY) * 1000;
      const lay = (c.pointName || "").charAt(0).toUpperCase() === "K" ? "KYOMOJI" : "KYO";
      push("0", "LWPOLYLINE", "5", H(), "100", "AcDbEntity", "8", lay, "100", "AcDbPolyline",
        "90", "2", "70", "1", "43", "75.0",
        "10", dxfNum(cx - 37.5), "20", dxfNum(cy), "42", "1.0",
        "10", dxfNum(cx + 37.5), "20", dxfNum(cy), "42", "1.0");
    } else {
      push("0", "CIRCLE", "5", H(), "100", "AcDbEntity", "8", dxfCircleLayer(c.layer), "100", "AcDbCircle",
        "10", X(c.x), "20", Y(c.y), "30", "0.0", "40", dxfNum(c.r * 1000));
    }
  }

  for (const m of trc.mojis) {
    if (m.del || m.sketch) continue;
    const c0 = (m.layer || "").charAt(0);
    if (c0 === "S" || c0 === "L") continue;
    if (m.text == null) m.text = "";
    const lay = dxfMojiLayer(m.layer);
    const rows = String(m.text).split(/\r?\n/);
    if (rows.length > 1) {
      const LS = 265;
      rows.forEach((row, i) => {
        push("0", "TEXT", "5", H(), "100", "AcDbEntity", "8", lay, "100", "AcDbText",
          "10", X(m.x), "20", dxfNum((m.y - minY) * 1000 + (rows.length * LS) / 2 - i * LS - 185),
          "30", "0.0", "40", "200.0", "1", row.trim(), "72", "0", "7", "MSPGothic", "100", "AcDbText");
      });
    } else {
      push("0", "TEXT", "5", H(), "100", "AcDbEntity", "8", lay, "100", "AcDbText",
        "10", X(m.x), "20", Y(m.y), "30", "0.0", "40", "200.0", "1", m.text);
      if (m.angle) push("50", String(360 - m.angle));
      push("72", "4", "11", X(m.x), "21", Y(m.y), "7", "MSPGothic", "100", "AcDbText");
    }
  }

  for (const ins of trc.inserts) {
    if (ins.del || ins.sketch) continue;
    const blk = trc.blocks.get(ins.block);
    if (!blk || blk.pts.length === 0) continue;
    const bname = ins.block === "Uekomi" ? "KABU1" : ins.block;
    push("0", "INSERT", "5", H(), "100", "AcDbEntity", "8", dxfInsertLayer(ins.layer), "100", "AcDbBlockReference",
      "2", bname, "10", X(ins.x), "20", Y(ins.y), "30", "0.0");
    if (ins.angle) push("50", String(-ins.angle));
  }

  for (const pl of plines) {
    push("0", "INSERT", "5", H(), "100", "AcDbEntity", "8", "0", "100", "AcDbBlockReference",
      "2", pl.name, "10", "0.0", "20", "0.0", "30", "0.0");
  }

  // コメント → MTEXT
  const comments = trc.comments.filter(c => c.check).sort((a, b) => a.sort - b.sort);
  if (comments.length) {
    let mxX = -Infinity, mxY = -Infinity;
    for (const p of trc.points) if (!p.notDisp) { if (p.x > mxX) mxX = p.x; if (p.y > mxY) mxY = p.y; }
    if (!isFinite(mxX)) { mxX = minX; mxY = minY; }
    let posY = (mxY - minY) * 1000;
    const posX = (mxX - minX) * 1000 + 3000;
    for (const c of comments) {
      push("0", "MTEXT", "5", H(), "100", "AcDbEntity", "8", "TEXT", "100", "AcDbMText",
        "10", dxfNum(posX), "20", dxfNum(posY), "30", "0.0", "40", "250.0",
        "1", String(c.text).replace(/\|/g, "\\P"));
      posY -= (String(c.text).split("|").length * 250 + 800);
    }
  }

  push("0", "ENDSEC");

  // 5) OBJECTS（雛形・完結）+ EOF
  pushTmpl(T.OBJECTSSECTION00);
  push("0", "EOF");

  return out.join("\r\n") + "\r\n";
}

async function saveDxf() {
  if (!hasData) return;
  const base = (currentName || "drawing").replace(/\.[^.]*$/, "");
  let text;
  if (mode === "dxf") { text = entitiesToDxf(entities); }
  else if (mode === "trc") {
    try {
      text = await trcToDxfFull(trc);            // AC1015 (trcad 構造準拠)
    } catch (e) {
      console.warn("AC1015 雛形を読めないため R12 で出力します:", e);
      text = trcToDxf(trc);                      // 雛形が無い場合は軽量 R12 にフォールバック
    }
  } else { return; }
  downloadBlob(new Blob([text], { type: "application/dxf" }), base + ".dxf");
}

function downloadBlob(blob, filename) {
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url;
  a.download = filename;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  setTimeout(() => URL.revokeObjectURL(url), 1000);
}

// ===========================================================================
// レベル（水準）データ Excel 出力 — trcad 雛形 Level入力.xlsm への差し込み方式
//   cad-trcad frmTrCAD.btnLevelExcel_Click を参考に実装。
//   雛形を fetch → A=点名 / B=BS(m) / C=FS(m) を該当セルへ差し込み → .xlsm 出力。
//   D(器械高)/E(実測値)/F(較差) は雛形の数式をそのまま保持し Excel が再計算する。
//   雛形の変更しないエントリ(マクロ/書式/図形等)は元の圧縮バイトをそのまま流用する。
// ===========================================================================
const CRC32_TABLE = (() => {
  const t = new Uint32Array(256);
  for (let n = 0; n < 256; n++) {
    let c = n;
    for (let k = 0; k < 8; k++) c = (c & 1) ? (0xEDB88320 ^ (c >>> 1)) : (c >>> 1);
    t[n] = c >>> 0;
  }
  return t;
})();

function crc32(u8) {
  let c = 0xFFFFFFFF;
  for (let i = 0; i < u8.length; i++) c = CRC32_TABLE[(c ^ u8[i]) & 0xFF] ^ (c >>> 8);
  return (c ^ 0xFFFFFFFF) >>> 0;
}

const xmlEsc = (s) => String(s == null ? "" : s)
  .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;")
  .replace(/"/g, "&quot;").replace(/'/g, "&apos;");

// 汎用 ZIP ビルダ。各エントリ: { name, method, crc, compSize, uncompSize, data }
//   method=0(無圧縮): data は生バイト。method=8(deflate): data は元の圧縮バイトを流用。
function zipBuild(entries) {
  const enc = new TextEncoder();
  const u16 = (n) => [n & 0xFF, (n >>> 8) & 0xFF];
  const u32 = (n) => [n & 0xFF, (n >>> 8) & 0xFF, (n >>> 16) & 0xFF, (n >>> 24) & 0xFF];
  const parts = [], central = [];
  let offset = 0;
  for (const e of entries) {
    const nameBytes = enc.encode(e.name);
    const lh = new Uint8Array([].concat(
      u32(0x04034b50), u16(20), u16(0x0800), u16(e.method), u16(0), u16(0),
      u32(e.crc), u32(e.compSize), u32(e.uncompSize), u16(nameBytes.length), u16(0)
    ));
    parts.push(lh, nameBytes, e.data);
    const cen = new Uint8Array([].concat(
      u32(0x02014b50), u16(20), u16(20), u16(0x0800), u16(e.method), u16(0), u16(0),
      u32(e.crc), u32(e.compSize), u32(e.uncompSize), u16(nameBytes.length),
      u16(0), u16(0), u16(0), u16(0), u32(0), u32(offset)
    ));
    central.push(cen, nameBytes);
    offset += lh.length + nameBytes.length + e.data.length;
  }
  const centralStart = offset;
  let centralSize = 0; for (const c of central) centralSize += c.length;
  const eocd = new Uint8Array([].concat(
    u32(0x06054b50), u16(0), u16(0), u16(entries.length), u16(entries.length),
    u32(centralSize), u32(centralStart), u16(0)
  ));
  let total = eocd.length;
  for (const p of parts) total += p.length;
  for (const c of central) total += c.length;
  const out = new Uint8Array(total); let pos = 0;
  for (const p of parts)   { out.set(p, pos); pos += p.length; }
  for (const c of central) { out.set(c, pos); pos += c.length; }
  out.set(eocd, pos);
  return out;
}

// ZIP を全エントリ解析（セントラルディレクトリ基準・順序保持）。
function parseZipAll(buf) {
  const dv = new DataView(buf), u8 = new Uint8Array(buf);
  const asc = new TextDecoder("ascii");
  let eocd = -1;
  for (let i = buf.byteLength - 22; i >= 0; i--) {
    if (dv.getUint32(i, true) === 0x06054b50) { eocd = i; break; }
  }
  if (eocd < 0) throw new Error("ZIP 終端レコードが見つかりません");
  const cdCount = dv.getUint16(eocd + 10, true);
  let p = dv.getUint32(eocd + 16, true);
  const entries = [];
  for (let k = 0; k < cdCount; k++) {
    if (dv.getUint32(p, true) !== 0x02014b50) break;
    const method = dv.getUint16(p + 10, true);
    const crc = dv.getUint32(p + 16, true);
    const compSize = dv.getUint32(p + 20, true);
    const uncompSize = dv.getUint32(p + 24, true);
    const nameLen = dv.getUint16(p + 28, true);
    const extraLen = dv.getUint16(p + 30, true);
    const cmtLen = dv.getUint16(p + 32, true);
    const lhOff = dv.getUint32(p + 42, true);
    const name = asc.decode(u8.subarray(p + 46, p + 46 + nameLen));
    const lNameLen = dv.getUint16(lhOff + 26, true);
    const lExtraLen = dv.getUint16(lhOff + 28, true);
    const start = lhOff + 30 + lNameLen + lExtraLen;
    entries.push({ name, method, crc, compSize, uncompSize,
                   data: u8.slice(start, start + compSize) });
    p += 46 + nameLen + extraLen + cmtLen;
  }
  return entries;
}

const LEVEL_TEMPLATE_URL = "Level入力.xlsm";

async function exportLevelExcel() {
  if (mode !== "trc" || !trc || !trc.levels.length) return;
  const calc = computeLevels(trc.levels);
  const isNum = (s) => { s = (s == null ? "" : String(s)).trim(); return s !== "" && !isNaN(Number(s)); };
  const m = (s) => Math.round(Number(String(s).trim())) / 1000; // mm→m

  // 雛形を取得
  let tmplBuf;
  try {
    const res = await fetch(LEVEL_TEMPLATE_URL);
    if (!res.ok) throw new Error("HTTP " + res.status);
    tmplBuf = await res.arrayBuffer();
  } catch (e) {
    alert("レベル雛形 (Level入力.xlsm) を読み込めません: " + (e && e.message ? e.message : e)
        + "\nindex.html と同じフォルダに Level入力.xlsm を置いてください。");
    return;
  }

  const entries = parseZipAll(tmplBuf);
  const enc = new TextEncoder();
  const dec = new TextDecoder("utf-8");

  // 書き込み対象（点名あり かつ BS/FS/TP のいずれかが数値）
  const data = calc.filter(r =>
    r.name != null && String(r.name).trim() !== "" &&
    (isNum(r.bs) || isNum(r.fs) || isNum(r.tp)));

  // --- sheet1.xml にセル差し込み（A=点名 / B=BS / C=FS） ---
  const sheetEntry = entries.find(e => e.name === "xl/worksheets/sheet1.xml");
  if (!sheetEntry) { alert("雛形の sheet1.xml が見つかりません"); return; }
  let sheet = dec.decode(sheetEntry.method === 8 ? await inflateRaw(sheetEntry.data) : sheetEntry.data);

  const ROWS_PER_BLOCK = 100, BLOCK_COLS = 6, DATA_ROW = 6;
  const colLet = (i) => { let s = "", n = i + 1; while (n > 0) { const r = (n - 1) % 26; s = String.fromCharCode(65 + r) + s; n = (n - r - 1) / 26; } return s; };

  // 指定セルの値を差し替え（style 属性 s= は維持。元の数式は除去される）
  const setCell = (ref, mk) => {
    const re = new RegExp('<c r="' + ref + '"([^>]*?)(?:/>|>[\\s\\S]*?</c>)');
    sheet = sheet.replace(re, (full, attrs) => {
      const sm = (attrs || "").match(/\ss="(\d+)"/);
      return mk(sm ? ' s="' + sm[1] + '"' : "");
    });
  };
  const cellNum = (ref, val) => setCell(ref, (s) => '<c r="' + ref + '"' + s + '><v>' + val + '</v></c>');
  const cellStr = (ref, val) => setCell(ref, (s) => '<c r="' + ref + '"' + s + ' t="inlineStr"><is><t xml:space="preserve">' + xmlEsc(val) + '</t></is></c>');
  const cellEmpty = (ref) => setCell(ref, (s) => '<c r="' + ref + '"' + s + '/>');

  // trcad frmTrCAD.btnLevelExcel_Click と同じ分岐順で列へ書き込む。
  //   BS数値 → B列、BS基準値 LevelBS を BS+GH で更新
  //   BS参照[n] → C列に物理前視値 (LevelBS - GH)/1000
  //   FS数値 / TP数値 → C列
  let levelBS = 0; // BS基準値 (mm)。btnLevelExcel の LevelBS に相当
  data.forEach((r, d) => {
    const cb = Math.floor(d / ROWS_PER_BLOCK) * BLOCK_COLS;
    const rr = DATA_ROW + (d % ROWS_PER_BLOCK);
    const bs = (r.bs == null ? "" : String(r.bs)).trim();
    const gh = (r.gh != null && isFinite(r.gh)) ? r.gh : null;
    cellStr(colLet(cb + 0) + rr, String(r.name));                 // A: 点名（数式を上書き）
    if (isNum(bs)) {
      cellNum(colLet(cb + 1) + rr, m(bs));                        // B: BS (m)
      if (gh != null) levelBS = Number(bs) + gh;                  // BS基準値を更新
    } else if (bs.charAt(0) === "[") {
      if (gh != null) cellNum(colLet(cb + 2) + rr, (levelBS - gh) / 1000); // C: 参照点の物理前視値
    } else if (isNum(r.fs)) {
      cellNum(colLet(cb + 2) + rr, m(r.fs));                      // C: FS (m)
    } else if (isNum(r.tp)) {
      cellNum(colLet(cb + 2) + rr, m(r.tp));                      // C: TP も FS 列
    }
  });
  // 最終データ行の次の A セルを空にして自動連番(数式)を止める
  if (data.length) {
    const lastIdx = data.length - 1;
    const cb = Math.floor(lastIdx / ROWS_PER_BLOCK) * BLOCK_COLS;
    const off = lastIdx % ROWS_PER_BLOCK;
    if (off + 1 < ROWS_PER_BLOCK) cellEmpty(colLet(cb) + (DATA_ROW + off + 1));
  }
  sheetEntry.method = 0;
  sheetEntry.data = enc.encode(sheet);
  sheetEntry.crc = crc32(sheetEntry.data);
  sheetEntry.compSize = sheetEntry.uncompSize = sheetEntry.data.length;

  // --- workbook.xml: 起動時に数式を全再計算させる ---
  const wbEntry = entries.find(e => e.name === "xl/workbook.xml");
  if (wbEntry) {
    let wb = dec.decode(wbEntry.method === 8 ? await inflateRaw(wbEntry.data) : wbEntry.data);
    if (/<calcPr[^>]*>/.test(wb)) {
      wb = wb.replace(/<calcPr([^>]*?)\/>/, (full, a) =>
        /fullCalcOnLoad/.test(a) ? full : '<calcPr' + a + ' fullCalcOnLoad="1"/>');
    } else {
      wb = wb.replace('</sheets>', '</sheets><calcPr fullCalcOnLoad="1"/>');
    }
    wbEntry.method = 0;
    wbEntry.data = enc.encode(wb);
    wbEntry.crc = crc32(wbEntry.data);
    wbEntry.compSize = wbEntry.uncompSize = wbEntry.data.length;
  }

  const base = (currentName || "level").replace(/\.[^.]*$/, "");
  const out = zipBuild(entries);
  downloadBlob(new Blob([out], {
    type: "application/vnd.ms-excel.sheet.macroEnabled.12"
  }), base + "_Level.xlsm");
}

// ===========================================================================
// イベント
// ===========================================================================
saveBtn.addEventListener("click", saveDxf);
levelXlsxBtn.addEventListener("click", exportLevelExcel);

// DXF とレベル Excel をまとめて出力
async function exportBoth() {
  if (!hasData) return;
  await saveDxf();
  await new Promise(r => setTimeout(r, 300)); // 連続ダウンロードのブロック回避
  await exportLevelExcel();
}
bothBtn.addEventListener("click", exportBoth);

document.getElementById("fileInput").addEventListener("change", (e) => {
  handleFile(e.target.files[0]);
});

// ドラッグ&ドロップ
const stage = document.getElementById("stage");
["dragenter", "dragover"].forEach(ev =>
  stage.addEventListener(ev, (e) => {
    e.preventDefault(); e.stopPropagation();
    dropEl.classList.remove("hidden");
    dropEl.classList.add("over");
  })
);
["dragleave", "drop"].forEach(ev =>
  stage.addEventListener(ev, (e) => {
    e.preventDefault(); e.stopPropagation();
    dropEl.classList.remove("over");
    if (hasData) dropEl.classList.add("hidden");
  })
);
stage.addEventListener("drop", (e) => {
  const f = e.dataTransfer.files[0];
  if (f) handleFile(f);
});

// ズーム / パン / 座標表示
canvas.addEventListener("wheel", (e) => {
  e.preventDefault();
  if (!hasData) return;
  const rect = canvas.getBoundingClientRect();
  const mx = e.clientX - rect.left;
  const my = e.clientY - rect.top;
  const factor = e.deltaY < 0 ? 1.1 : 1 / 1.1;
  view.ox = mx - (mx - view.ox) * factor;
  view.oy = my - (my - view.oy) * factor;
  view.scale *= factor;
  draw();
}, { passive: false });

let dragging = false, lastX = 0, lastY = 0;
canvas.addEventListener("mousedown", (e) => {
  dragging = true; lastX = e.clientX; lastY = e.clientY;
});
window.addEventListener("mousemove", (e) => {
  if (hasData) {
    const rect = canvas.getBoundingClientRect();
    if (e.clientX >= rect.left && e.clientX <= rect.right &&
        e.clientY >= rect.top && e.clientY <= rect.bottom) {
      const mxv = mxFromScreen(e.clientX - rect.left);
      const myv = myFromScreen(e.clientY - rect.top);
      coordEl.textContent = `X ${mxv.toFixed(3)}  Y ${myv.toFixed(3)}`;
    }
  }
  if (!dragging) return;
  view.ox += e.clientX - lastX;
  view.oy += e.clientY - lastY;
  lastX = e.clientX; lastY = e.clientY;
  draw();
});
window.addEventListener("mouseup", () => { dragging = false; });
canvas.addEventListener("dblclick", () => { if (hasData) { fitView(); draw(); } });

// 左右分割のリサイズ (初期比 2:1, ドラッグで調整)
const splitter = document.getElementById("splitter");
const mainEl = document.getElementById("main");
let splitDrag = false;
splitter.addEventListener("mousedown", (e) => { splitDrag = true; e.preventDefault(); });
window.addEventListener("mousemove", (e) => {
  if (!splitDrag) return;
  const rect = mainEl.getBoundingClientRect();
  let frac = (e.clientX - rect.left) / rect.width;
  frac = Math.max(0.15, Math.min(0.85, frac));
  stage.style.flexGrow = frac;
  panel.style.flexGrow = (1 - frac);
  render();
});
window.addEventListener("mouseup", () => { splitDrag = false; });

// 表示トグル
[chkLine, chkLabel, chkMoji, chkFrame].forEach(chk =>
  chk.addEventListener("change", () => { if (mode === "trc") draw(); })
);

// スマホ: 図面 ⇄ データ を全面切替
viewToggle.addEventListener("click", () => {
  const showPanel = !mainEl.classList.contains("view-panel");
  mainEl.classList.toggle("view-panel", showPanel);
  viewToggle.textContent = showPanel ? "📐 図面" : "📋 データ";
  if (showPanel) renderPanel();
  else render(); // 図面に戻す際はキャンバス再計測
});

window.addEventListener("resize", render);
resizeCanvas();
</script>
