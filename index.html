<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DXF / TRC ビューワー</title>
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; font-family: "Segoe UI", "Meiryo", sans-serif; }
  body { display: flex; flex-direction: column; background: #1e1e1e; color: #ddd; }

  header {
    flex: 0 0 auto;
    display: flex;
    align-items: center;
    gap: 16px;
    padding: 8px 16px;
    background: #2d2d30;
    border-bottom: 1px solid #3f3f46;
  }
  header h1 { font-size: 15px; margin: 0; font-weight: 600; }
  #controls { display: flex; align-items: center; gap: 14px; }
  #controls.hidden { display: none; }
  #controls label { font-size: 12px; color: #cfcfcf; display: flex; align-items: center; gap: 4px; cursor: pointer; }
  #info { font-size: 12px; color: #9a9a9a; margin-left: auto; }
  #fileLabel {
    font-size: 12px;
    background: #0e639c;
    color: #fff;
    padding: 4px 12px;
    border-radius: 4px;
    cursor: pointer;
  }
  #fileLabel:hover { background: #1177bb; }

  #stage { position: relative; flex: 1 1 auto; overflow: hidden; }
  canvas { display: block; width: 100%; height: 100%; background: #111; }

  #drop {
    position: absolute; inset: 0;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    gap: 12px;
    pointer-events: none;
    color: #888;
    transition: background 0.15s, color 0.15s;
  }
  #drop.empty { pointer-events: auto; }
  #drop.over {
    background: rgba(14, 99, 156, 0.25);
    color: #cfe8ff;
    border: 2px dashed #1177bb;
  }
  #drop .big { font-size: 22px; }
  #drop .small { font-size: 13px; }
  #drop.hidden { display: none; }

  #hud {
    position: absolute; left: 12px; bottom: 10px;
    font-size: 11px; color: #888;
    background: rgba(0,0,0,0.4);
    padding: 4px 8px; border-radius: 4px;
    pointer-events: none;
  }
  #coord {
    position: absolute; right: 12px; bottom: 10px;
    font-size: 11px; color: #9ad; font-variant-numeric: tabular-nums;
    background: rgba(0,0,0,0.4);
    padding: 4px 8px; border-radius: 4px;
    pointer-events: none;
  }
</style>
</head>
<body>
  <header>
    <h1>DXF / TRC ビューワー</h1>
    <label id="fileLabel">ファイルを開く
      <input id="fileInput" type="file" accept=".dxf,.trc" hidden>
    </label>
    <div id="controls" class="hidden">
      <label><input type="checkbox" id="chkConnect"> 結線</label>
      <label><input type="checkbox" id="chkCode"> コード表示</label>
      <label><input type="checkbox" id="chkLabel" checked> 点名表示</label>
    </div>
    <span id="info"></span>
  </header>

  <div id="stage">
    <canvas id="canvas"></canvas>
    <div id="drop" class="empty">
      <div class="big">📐 DXF / TRC ファイルをここにドロップ</div>
      <div class="small">またはヘッダーの「ファイルを開く」から選択（.dxf / .trc）</div>
    </div>
    <div id="hud">ホイール: 拡大縮小 / ドラッグ: 移動 / ダブルクリック: 全体表示</div>
    <div id="coord"></div>
  </div>

<script>
"use strict";

// ===========================================================================
// DXF パーサ (ASCII DXF の group-code / value ペアを読み、基本エンティティを抽出)
// ===========================================================================
function parseDxf(text) {
  const lines = text.split(/\r\n|\r|\n/);
  const pairs = [];
  for (let i = 0; i + 1 < lines.length; i += 2) {
    const code = parseInt(lines[i].trim(), 10);
    if (Number.isNaN(code)) continue;
    pairs.push([code, lines[i + 1]]);
  }

  const entities = [];
  let i = 0;
  const n = pairs.length;

  while (i < n) {
    const [code, val] = pairs[i];
    if (code === 0 && val.trim() === "SECTION") {
      if (i + 1 < n && pairs[i + 1][0] === 2 && pairs[i + 1][1].trim() === "ENTITIES") {
        i += 2;
        break;
      }
    }
    i++;
  }

  function readEntity(startType) {
    const e = { type: startType, props: {}, vertices: [] };
    let pendingX = null;
    while (i < n) {
      const [code, raw] = pairs[i];
      if (code === 0) break;
      const val = raw.trim();
      if (code === 10) {
        pendingX = parseFloat(val);
        e.props.x = parseFloat(val);
      } else if (code === 20) {
        e.props.y = parseFloat(val);
        if (pendingX !== null && startType === "LWPOLYLINE") {
          e.vertices.push({ x: pendingX, y: parseFloat(val) });
          pendingX = null;
        }
      } else if (code === 11) { e.props.x2 = parseFloat(val); }
      else if (code === 21) { e.props.y2 = parseFloat(val); }
      else if (code === 40) { e.props.r = parseFloat(val); e.props.height = parseFloat(val); }
      else if (code === 50) { e.props.startAngle = parseFloat(val); }
      else if (code === 51) { e.props.endAngle = parseFloat(val); }
      else if (code === 70) { e.props.flags = parseInt(val, 10); }
      else if (code === 1)  { e.props.text = raw; }
      else if (code === 8)  { e.props.layer = val; }
      i++;
    }
    return e;
  }

  function readPolyline() {
    const e = { type: "POLYLINE", props: {}, vertices: [] };
    while (i < n && pairs[i][0] !== 0) {
      const [code, raw] = pairs[i];
      if (code === 70) e.props.flags = parseInt(raw.trim(), 10);
      if (code === 8) e.props.layer = raw.trim();
      i++;
    }
    while (i < n) {
      const [code, val] = pairs[i];
      if (code === 0) {
        const t = val.trim();
        if (t === "VERTEX") {
          i++;
          let vx = 0, vy = 0;
          while (i < n && pairs[i][0] !== 0) {
            const [c, r] = pairs[i];
            if (c === 10) vx = parseFloat(r.trim());
            else if (c === 20) vy = parseFloat(r.trim());
            i++;
          }
          e.vertices.push({ x: vx, y: vy });
        } else if (t === "SEQEND") {
          i++;
          while (i < n && pairs[i][0] !== 0) i++;
          break;
        } else {
          break;
        }
      } else {
        i++;
      }
    }
    return e;
  }

  while (i < n) {
    const [code, raw] = pairs[i];
    const val = raw.trim();
    if (code === 0) {
      if (val === "ENDSEC") break;
      const type = val;
      i++;
      if (type === "POLYLINE") {
        entities.push(readPolyline());
      } else if (["LINE", "LWPOLYLINE", "CIRCLE", "ARC", "POINT", "TEXT", "MTEXT"].includes(type)) {
        entities.push(readEntity(type));
      } else {
        while (i < n && pairs[i][0] !== 0) i++;
      }
    } else {
      i++;
    }
  }

  return entities;
}

// ===========================================================================
// TRC パーサ (測量座標点ファイル)
//   1 行 = 点名, X(横/東), Y(縦/北), [Z 標高], [コード]
//   区切り: カンマ / タブ / 空白    コメント行: ' または # 始まり
// ===========================================================================
function parseTrc(text) {
  const points = [];
  const lines = text.split(/\r\n|\r|\n/);
  for (const raw of lines) {
    const line = raw.trim();
    if (line === "") continue;
    if (line.startsWith("'") || line.startsWith("#")) continue;
    const parts = line.split(/[,\t ]+/).filter(s => s !== "");
    if (parts.length < 3) continue;
    const x = parseFloat(parts[1]);
    const y = parseFloat(parts[2]);
    if (!isFinite(x) || !isFinite(y)) continue;   // ヘッダ行などをスキップ
    const p = { name: parts[0], x, y };
    if (parts.length >= 4) { const z = parseFloat(parts[3]); if (isFinite(z)) p.z = z; }
    if (parts.length >= 5) p.code = parts.slice(4).join(" ");
    points.push(p);
  }
  return points;
}

// Shift-JIS 優先でテキストをデコード (TRC は SJIS が一般的、UTF-8 もフォールバック対応)
function decodeText(buffer, preferSjis) {
  const tryDecode = (label) => {
    try { return new TextDecoder(label, { fatal: false }).decode(buffer); }
    catch (e) { return null; }
  };
  if (preferSjis) {
    return tryDecode("shift_jis") || tryDecode("utf-8") || "";
  }
  return tryDecode("utf-8") || tryDecode("shift_jis") || "";
}

// ===========================================================================
// 状態
// ===========================================================================
const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d");
const info = document.getElementById("info");
const dropEl = document.getElementById("drop");
const controls = document.getElementById("controls");
const coordEl = document.getElementById("coord");
const chkConnect = document.getElementById("chkConnect");
const chkCode = document.getElementById("chkCode");
const chkLabel = document.getElementById("chkLabel");

let mode = null;          // "dxf" | "trc"
let entities = [];        // DXF
let points = [];          // TRC
let view = { scale: 1, ox: 0, oy: 0 };
let hasData = false;

// ===========================================================================
// 表示領域計算
// ===========================================================================
function resizeCanvas() {
  const dpr = window.devicePixelRatio || 1;
  const rect = canvas.getBoundingClientRect();
  canvas.width = Math.round(rect.width * dpr);
  canvas.height = Math.round(rect.height * dpr);
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
}

function computeBounds() {
  let minX = Infinity, minY = Infinity, maxX = -Infinity, maxY = -Infinity;
  const ext = (x, y) => {
    if (x < minX) minX = x; if (y < minY) minY = y;
    if (x > maxX) maxX = x; if (y > maxY) maxY = y;
  };
  if (mode === "trc") {
    for (const p of points) ext(p.x, p.y);
  } else if (mode === "dxf") {
    for (const e of entities) {
      switch (e.type) {
        case "LINE":
          ext(e.props.x, e.props.y); ext(e.props.x2, e.props.y2); break;
        case "CIRCLE":
        case "ARC":
          ext(e.props.x - e.props.r, e.props.y - e.props.r);
          ext(e.props.x + e.props.r, e.props.y + e.props.r); break;
        case "POINT":
        case "TEXT":
        case "MTEXT":
          ext(e.props.x, e.props.y); break;
        case "LWPOLYLINE":
        case "POLYLINE":
          for (const v of e.vertices) ext(v.x, v.y); break;
      }
    }
  }
  if (!isFinite(minX)) return null;
  return { minX, minY, maxX, maxY };
}

function fitView() {
  const b = computeBounds();
  const rect = canvas.getBoundingClientRect();
  if (!b) { view = { scale: 1, ox: rect.width / 2, oy: rect.height / 2 }; return; }
  const w = b.maxX - b.minX || 1;
  const h = b.maxY - b.minY || 1;
  const pad = 50;
  const scale = Math.min((rect.width - pad * 2) / w, (rect.height - pad * 2) / h);
  view.scale = scale;
  const cx = (b.minX + b.maxX) / 2;
  const cy = (b.minY + b.maxY) / 2;
  view.ox = rect.width / 2 - cx * scale;
  view.oy = rect.height / 2 + cy * scale; // y 反転
}

// モデル座標 -> 画面座標
function tx(x) { return x * view.scale + view.ox; }
function ty(y) { return -y * view.scale + view.oy; }
// 画面座標 -> モデル座標
function mxFromScreen(sx) { return (sx - view.ox) / view.scale; }
function myFromScreen(sy) { return -(sy - view.oy) / view.scale; }

// ===========================================================================
// 描画
// ===========================================================================
function draw() {
  const rect = canvas.getBoundingClientRect();
  ctx.clearRect(0, 0, rect.width, rect.height);
  if (mode === "trc") drawTrc();
  else if (mode === "dxf") drawDxf();
}

function drawDxf() {
  ctx.lineWidth = 1;
  ctx.strokeStyle = "#d7e3ff";
  ctx.fillStyle = "#d7e3ff";

  for (const e of entities) {
    ctx.beginPath();
    switch (e.type) {
      case "LINE":
        ctx.moveTo(tx(e.props.x), ty(e.props.y));
        ctx.lineTo(tx(e.props.x2), ty(e.props.y2));
        ctx.stroke();
        break;
      case "CIRCLE":
        ctx.arc(tx(e.props.x), ty(e.props.y), e.props.r * view.scale, 0, Math.PI * 2);
        ctx.stroke();
        break;
      case "ARC": {
        const a0 = -e.props.endAngle * Math.PI / 180;
        const a1 = -e.props.startAngle * Math.PI / 180;
        ctx.arc(tx(e.props.x), ty(e.props.y), e.props.r * view.scale, a0, a1);
        ctx.stroke();
        break;
      }
      case "LWPOLYLINE":
      case "POLYLINE": {
        if (e.vertices.length) {
          ctx.moveTo(tx(e.vertices[0].x), ty(e.vertices[0].y));
          for (let k = 1; k < e.vertices.length; k++)
            ctx.lineTo(tx(e.vertices[k].x), ty(e.vertices[k].y));
          if (e.props.flags & 1) ctx.closePath();
          ctx.stroke();
        }
        break;
      }
      case "POINT":
        ctx.arc(tx(e.props.x), ty(e.props.y), 2, 0, Math.PI * 2);
        ctx.fill();
        break;
      case "TEXT":
      case "MTEXT": {
        if (e.props.text != null) {
          const size = Math.max(8, (e.props.height || 1) * view.scale);
          ctx.save();
          ctx.font = size + "px sans-serif";
          ctx.fillText(e.props.text, tx(e.props.x), ty(e.props.y));
          ctx.restore();
        }
        break;
      }
    }
  }
}

function drawTrc() {
  // 結線（入力順に結ぶ）
  if (chkConnect.checked && points.length >= 2) {
    ctx.strokeStyle = "#5b8dd9";
    ctx.lineWidth = 1.2;
    ctx.beginPath();
    ctx.moveTo(tx(points[0].x), ty(points[0].y));
    for (let k = 1; k < points.length; k++) ctx.lineTo(tx(points[k].x), ty(points[k].y));
    ctx.stroke();
  }

  // 点とラベル
  ctx.font = "12px 'MS Gothic', monospace";
  ctx.textBaseline = "alphabetic";
  for (const p of points) {
    const sx = tx(p.x), sy = ty(p.y);
    ctx.fillStyle = "#ff5c5c";
    ctx.beginPath();
    ctx.arc(sx, sy, 3.2, 0, Math.PI * 2);
    ctx.fill();

    let label = "";
    if (chkLabel.checked) label = p.name;
    if (chkCode.checked && p.code) label += (label ? " " : "") + p.code;
    if (label) {
      ctx.fillStyle = "#e7e7e7";
      ctx.fillText(label, sx + 6, sy - 6);
    }
  }
}

function render() { resizeCanvas(); draw(); }

// ===========================================================================
// ファイル読み込み
// ===========================================================================
function loadDxf(text, name) {
  mode = "dxf";
  entities = parseDxf(text);
  points = [];
  controls.classList.add("hidden");
  finishLoad(name, `${entities.length} エンティティ`);
}

function loadTrc(text, name) {
  mode = "trc";
  points = parseTrc(text);
  entities = [];
  controls.classList.remove("hidden");
  finishLoad(name, `${points.length} 点`);
}

function finishLoad(name, summary) {
  hasData = true;
  dropEl.classList.add("hidden");
  dropEl.classList.remove("empty");
  fitView();
  draw();
  const kind = mode.toUpperCase();
  info.textContent = `${name} — ${kind} / ${summary}`;
}

function handleFile(file) {
  if (!file) return;
  const ext = (file.name.split(".").pop() || "").toLowerCase();
  const reader = new FileReader();
  reader.onerror = () => alert("ファイルの読み込みに失敗しました");
  reader.onload = () => {
    try {
      if (ext === "trc") {
        const text = decodeText(reader.result, true);  // SJIS 優先
        loadTrc(text, file.name);
      } else {
        // .dxf もしくは拡張子不明は DXF として試行 (DXF は通常 ASCII/UTF-8)
        const text = decodeText(reader.result, false);
        loadDxf(text, file.name);
      }
    } catch (err) {
      alert("解析に失敗しました: " + err.message);
    }
  };
  reader.readAsArrayBuffer(file);
}

document.getElementById("fileInput").addEventListener("change", (e) => {
  handleFile(e.target.files[0]);
});

// ドラッグ&ドロップ
const stage = document.getElementById("stage");
["dragenter", "dragover"].forEach(ev =>
  stage.addEventListener(ev, (e) => {
    e.preventDefault(); e.stopPropagation();
    dropEl.classList.remove("hidden");
    dropEl.classList.add("over");
  })
);
["dragleave", "drop"].forEach(ev =>
  stage.addEventListener(ev, (e) => {
    e.preventDefault(); e.stopPropagation();
    dropEl.classList.remove("over");
    if (hasData) dropEl.classList.add("hidden");
  })
);
stage.addEventListener("drop", (e) => {
  const f = e.dataTransfer.files[0];
  if (f) handleFile(f);
});

// ===========================================================================
// ズーム / パン / 座標表示
// ===========================================================================
canvas.addEventListener("wheel", (e) => {
  e.preventDefault();
  if (!hasData) return;
  const rect = canvas.getBoundingClientRect();
  const mx = e.clientX - rect.left;
  const my = e.clientY - rect.top;
  const factor = e.deltaY < 0 ? 1.1 : 1 / 1.1;
  view.ox = mx - (mx - view.ox) * factor;
  view.oy = my - (my - view.oy) * factor;
  view.scale *= factor;
  draw();
}, { passive: false });

let dragging = false, lastX = 0, lastY = 0;
canvas.addEventListener("mousedown", (e) => {
  dragging = true; lastX = e.clientX; lastY = e.clientY;
});
window.addEventListener("mousemove", (e) => {
  // 座標表示
  if (hasData) {
    const rect = canvas.getBoundingClientRect();
    if (e.clientX >= rect.left && e.clientX <= rect.right &&
        e.clientY >= rect.top && e.clientY <= rect.bottom) {
      const mxv = mxFromScreen(e.clientX - rect.left);
      const myv = myFromScreen(e.clientY - rect.top);
      coordEl.textContent = `X ${mxv.toFixed(3)}  Y ${myv.toFixed(3)}`;
    }
  }
  if (!dragging) return;
  view.ox += e.clientX - lastX;
  view.oy += e.clientY - lastY;
  lastX = e.clientX; lastY = e.clientY;
  draw();
});
window.addEventListener("mouseup", () => { dragging = false; });
canvas.addEventListener("dblclick", () => { if (hasData) { fitView(); draw(); } });

// TRC 表示オプション
[chkConnect, chkCode, chkLabel].forEach(chk =>
  chk.addEventListener("change", () => { if (mode === "trc") draw(); })
);

window.addEventListener("resize", render);
resizeCanvas();
</script>
</body>
</html>
